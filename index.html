<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d47a1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Piscicultura - FJK</title>
<style>
:root{
  --bg:#f4f7f9; --surface:#ffffff; --line:#dde3ea; --fg:#11253d; --muted:#5d6b7a;
  --accent:#0d47a1; --accent-fg:#ffffff; --lima:#1976d2; --lima-claro:#e3eefb;
  --verde:#1f8f4e; --ok:#3f7d1a; --warn:#b26a00; --bad:#b3261e; --chip:#e3eefb;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.topo{background:linear-gradient(135deg,#0b3a82 0%,#1e88e5 100%);color:#fff;padding:14px max(12px,env(safe-area-inset-right,0px)) 14px max(12px,env(safe-area-inset-left,0px));border-radius:0 0 20px 20px}
.topoLinha{display:flex;align-items:center;gap:8px;min-height:66px}
body.naInicio .topoLinha{min-height:clamp(80px,24vw,130px)}
.topo img.topoLogo{height:clamp(52px,15.5vw,80px);width:auto;flex:none;display:block;margin:0}
body.naInicio .topo img.topoLogo{height:clamp(56px,16vw,96px)}
.topoTxt{flex:1;min-width:0;position:relative;padding-left:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;align-self:stretch}
.topoTxt::before{content:'';position:absolute;left:0;top:16%;bottom:16%;width:2px;border-radius:2px;background:#a9c41c;opacity:.85}
.topoTxt h1{color:#fff;margin:0;font-family:var(--body);font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;font-size:clamp(14px,4.4vw,22px);max-width:100%}
body.naInicio .topoTxt h1{font-size:clamp(16px,4.8vw,26px)}
.topoTxt .sub{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 6px;font-size:12.5px;margin-top:3px;color:#e7f5c2}
.topoTxt #hoje{white-space:nowrap;overflow:hidden;max-width:100%;font-size:clamp(9.5px,2.9vw,12.5px)}
body:not(.naInicio) .topo img.topoLogo{height:clamp(42px,12vw,70px)}
.stat{flex-wrap:nowrap!important}.stat div{flex:1 1 0!important;min-width:0}.stat small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.66rem!important}
.topo #nuvem{background:#fff;padding:0 6px;border-radius:99px;white-space:nowrap;font-size:9.5px;line-height:1.6;font-weight:700}
.sub{font-size:13px}
.nuvem{font-weight:600}
.voltarIni,.atualizarBtn{flex:none;border:0;background:none;line-height:1;padding:6px 4px;color:#fff;cursor:pointer}
.voltarIni{font-size:1.6rem}.atualizarBtn{font-size:1.6rem}
.atualizarBtn.girando{animation:girar .8s linear infinite}
@keyframes girar{from{transform:rotate(0)}to{transform:rotate(360deg)}}
body.naInicio .voltarIni{display:none}
h2{font-family:var(--display);font-stretch:condensed;font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel>h2:first-child,.panel>.curhead:first-child h2{border-left:5px solid var(--lima);padding-left:8px}
.curhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label{font-size:.85rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
input[type=number],input[type=text],input[type=password],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
select{font-weight:600}
textarea{min-height:70px;resize:vertical}
input.big{font-family:var(--display);font-stretch:condensed;font-size:2.2rem;font-weight:700;padding:8px 12px;text-align:center}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{font:inherit;font-weight:600;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:1.15rem;padding:14px}
button.verde{background:var(--verde);border-color:var(--verde);color:#fff;font-size:1.2rem;padding:16px}
button.lima{background:var(--lima);border-color:var(--lima);color:#fff}
button.danger{border-color:var(--bad);color:var(--bad)}
button.mini{padding:5px 10px;font-size:.92rem}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.note{font-size:.85rem;color:var(--muted);margin:0}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;max-width:90vw;text-align:center;z-index:20}
/* Início */
.inicio{display:none;flex-direction:column;gap:14px;padding-top:10px}
body.naInicio .inicio{display:flex}
button.grande{font-size:1.9rem;padding:24px 14px;border-radius:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;border:0}
button.gAbast{background:#3d9ad6;border-color:#3d9ad6;color:#fff}
button.gHist{background:#3d84c6;border-color:#3d84c6;color:#fff}
button.gCad{background:#11253d;border-color:#11253d;color:#fff}
button.gEnt{background:#5f6b73;border-color:#5f6b73;color:#fff}
button.gEst{background:#2c4f7c;border-color:#2c4f7c;color:#fff}
/* Escolha (fazendas / equipamentos) */
.escolha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.escolha button{padding:12px 4px;font-family:var(--display);font-stretch:condensed;font-size:1.15rem;line-height:1.1;min-height:58px}
.escolha button small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:500;margin-top:3px}
.escolha button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.escolha button.sel small{color:#c9d3df}
.escolha.eq button.sel{background:var(--lima);border-color:var(--lima);color:#fff}
.escolha.eq button.sel small{color:var(--fg)}
.vazio{background:var(--chip);border-radius:10px;padding:12px;font-size:.9rem;color:var(--muted);text-align:center}
.dataLinha{display:flex;align-items:center;gap:10px}
.dataLinha input{flex:1}
.dataLinha.outra input{border-color:var(--warn);background:#fff4e0;color:var(--warn);font-weight:700}
.passo{display:flex;flex-direction:column;gap:8px}
.resumoSel{background:var(--chip);border-radius:10px;padding:10px 12px;font-weight:600}
/* Pendentes (10 min, só neste aparelho) */
.pend{border:2px dashed var(--warn);background:#fffaf0}
.pendItem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pendTopo{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pendTopo b{font-family:var(--display);font-stretch:condensed;font-size:1.25rem}
.pendTopo .litros{font-family:var(--display);font-stretch:condensed;font-size:1.5rem;font-weight:700;white-space:nowrap}
details.pend summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.pend summary::-webkit-details-marker{display:none}
details.pend summary h2{border-left:5px solid var(--lima);padding-left:8px}
details.pend .seta{font-size:1.4rem;color:var(--muted);transition:transform .2s}
details.pend:not([open]) .seta{transform:rotate(-90deg)}
details.pend[open]{gap:14px}
details.pend:not([open]){gap:0}
.relogio{font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums}
/* Histórico */
.periodo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.estMini{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.estMini button{background:var(--chip);border:2px solid var(--lima);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:0;color:var(--fg)}
.estMini button.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:#cfe0f7}
.estMini small{font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.estMini b{font-family:var(--display);font-stretch:condensed;font-size:clamp(1.05rem,5.6vw,1.5rem);color:var(--ok);line-height:1.1;white-space:nowrap}.estMini b.neg{color:var(--bad)}
.tipoMov{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.tipoMov button{border:0;border-radius:12px;padding:13px 4px;font-weight:700;font-size:1rem;background:transparent;color:var(--fg)}
.tipoMov button.sel{background:var(--accent);color:#fff}
.reg .lt.mais{color:var(--verde)}
#tHist .stat b{white-space:nowrap;font-size:clamp(1.05rem,5.2vw,1.6rem)}
.periodo button{padding:8px 4px;font-size:.9rem;border-radius:99px}
.periodo button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.datas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.datas input{min-width:0;padding:10px 8px}
.datas>div{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:46px;text-align:center}
input[type=date]::-webkit-date-and-time-value{text-align:center;margin:0}
.datas input[type=date]{font-size:15px;padding:10px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;font-size:.92rem;border-radius:99px}
.chips button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{flex:1 1 90px;background:var(--chip);border-radius:10px;padding:8px 12px}
.stat small{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat b{font-family:var(--display);font-stretch:condensed;font-size:1.6rem}
.dia{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 2px 4px}
.reg{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-radius:0;border-left:0;border-right:0;border-top:0;text-align:left;font-weight:400}
.reg .eqn{font-family:var(--display);font-stretch:condensed;font-size:1.2rem;font-weight:700}
.reg .faz{font-size:.82rem;color:var(--muted)}
.reg .obs{font-size:.82rem;color:var(--fg);font-style:italic;margin-top:2px}
.reg .lt{font-family:var(--display);font-stretch:condensed;font-size:1.4rem;font-weight:700;white-space:nowrap;text-align:right}
.reg .lt small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;background:#fff4e0;color:var(--warn);margin-left:4px;vertical-align:middle}
.pdfChip{background:var(--chip);border-radius:8px;padding:8px 10px;font-weight:600;font-size:.9rem}
.compart{display:flex;gap:8px}.compart>button{flex:1 1 0;padding:12px 6px;font-size:1.02rem}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fotoSlot{position:relative;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;color:var(--muted);cursor:pointer;overflow:hidden}
.fotoSlot span{font-size:1.8rem}
.fotoSlot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fotoSlot img{width:100%;height:100%;object-fit:cover}
.fotoSlot .tirar{position:absolute;top:6px;right:6px;width:34px;height:34px;padding:0;border-radius:50%;border:0;background:rgba(17,37,61,.8);color:#fff;font-size:1rem}
.minis{display:flex;gap:6px}.minis img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.galeria{display:flex;flex-direction:column;gap:10px}.galeria img{width:100%;border-radius:10px;border:1px solid var(--line)}
.galeria .carregando{background:var(--chip);border-radius:10px;padding:30px;text-align:center;color:var(--muted)}
.det{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}.det dt{color:var(--muted);font-weight:600}.det dd{margin:0;font-weight:600}
.opcao{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--fg);margin:0;cursor:pointer}
.opcao input{width:22px;height:22px;accent-color:var(--accent)}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:600;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:12px 10px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--fg);margin:0}
.filebtn.lima{background:var(--lima);border-color:var(--lima);color:#fff}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.leitura{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.92rem}
.leitura.ok{background:#e6f4ea;color:#1f6b3a}.leitura.aviso{background:#fff4e0;color:var(--warn)}
.obrig{color:var(--bad)}
.estCard{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;font-weight:400}
.estCard.sel{border-color:var(--accent);border-width:3px}
.estTopo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.estTopo b{font-family:var(--display);font-stretch:condensed;font-size:1.35rem}
.saldo{font-family:var(--display);font-stretch:condensed;font-size:2rem;font-weight:700;color:var(--ok)}.saldo.neg{color:var(--bad)}
.estLinha{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}.estLinha b{color:var(--fg)}
.lt.ok{color:var(--verde)}
/* Teclado de senha (igual ao Gestão de Tratos) */
.senhaFundo{position:fixed;inset:0;z-index:30;background:rgba(17,37,61,.6)}
.teclado{position:fixed;bottom:0;z-index:31;left:50%;transform:translateX(-50%);max-width:100%;background:var(--bg);border-top:3px solid var(--lima);border-radius:16px 16px 0 0;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.15)}
.tecTopo{display:flex;justify-content:space-between;align-items:baseline;width:276px;max-width:100%;margin:0 auto;padding:2px 2px 6px;font-family:var(--display);font-stretch:condensed;font-size:1.05rem;font-weight:600}
.tecTopo b{font-size:1.5rem;letter-spacing:.15em}
.tecGrade{display:grid;grid-template-columns:repeat(3,88px);justify-content:center;gap:6px}
.teclado button{height:60px;padding:0;font-size:26px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 1px 0 var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.teclado button.tecSec{background:#eef1f4;font-size:1rem}
.teclado button:active{background:var(--lima-claro)}
.tecAcoes1{display:grid;width:276px;max-width:100%;margin:6px auto 0}
.tecAcoes1 button.tecOk{background:#1f8f4e;border-color:#1f8f4e;color:#fff;font-size:1.3rem;height:52px}
button.camBtn{font-size:1.2rem;padding:16px}
.enCampos{display:flex;flex-direction:column;gap:14px}
.subTit{padding:8px 12px 4px;border-top:2px solid var(--line);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafbf8}
.escolha.op button.sel{background:var(--lima);border-color:var(--lima);color:#fff}
.camLinha{display:flex;gap:8px;align-items:stretch}.camLinha .camBtn{flex:1;min-width:0}
.galBtn{position:relative;flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin:0;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:1.4rem;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--fg)}
.galBtn span{font-size:.72rem;font-weight:700}.galBtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#abFotos label.fotoSlot{display:none}
.dataBox{position:relative;display:block;flex:1;min-width:0}
.dataBox input[type=date]{position:absolute!important;inset:0;width:100%!important;height:100%!important;opacity:0;margin:0;cursor:pointer;z-index:1}
.dataTxt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 8px;font-weight:600}
.dataTxt::after{content:'📅';font-size:.95rem}
.dataTxt.vazio{color:var(--muted);font-weight:400}
.dataLinha.outra .dataTxt{border-color:var(--warn);background:#fff4e0;color:var(--warn)}
 #abFotos{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#abFotos .fotoSlot{aspect-ratio:1;border-radius:10px}
#abFotos label.fotoSlot{font-size:.62rem;gap:0;line-height:1.1;text-align:center}#abFotos label.fotoSlot span{font-size:1.2rem}
#abFotos .fotoSlot .tirar{width:24px;height:24px;font-size:.7rem;top:3px;right:3px}
.estAtual{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--chip);border:2px solid var(--lima);border-radius:12px;padding:10px 14px}
.estAtual small{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.estAtual b{white-space:nowrap;flex:none;font-family:var(--display);font-stretch:condensed;font-size:2rem;line-height:1;color:var(--ok)}.estAtual b.neg{color:var(--bad)}
.gTiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:10px}
.gTiles button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px;padding:14px 8px;border-radius:18px;border:0;background:var(--c);color:#fff;font-size:1.3rem;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.gTiles .gIc{font-size:2.6rem;line-height:1}
.gTiles button:last-child:nth-child(odd){grid-column:1/-1}
.eqTopo{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}.eqTopo label{margin:0}.eqTopo button{font-size:.8rem;padding:4px 8px}
.eqMarcar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.eqChk{display:flex;align-items:center;gap:8px;margin:0;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--muted);cursor:pointer;min-width:0}
.eqChk.on{border-color:var(--accent);background:var(--chip);color:var(--fg);font-weight:700}
.eqChk input{width:20px;height:20px;flex:none;accent-color:var(--accent);margin:0}
.eqChk span{min-width:0;overflow:hidden;text-overflow:ellipsis}.eqChk small{display:block;font-size:.72rem;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{white-space:normal!important;overflow:visible!important;font-size:.62rem!important;letter-spacing:.02em!important;line-height:1.2}
button.inativar{border-color:var(--warn);color:var(--warn)}
.eqLinha.inativo{background:#f4f5f6}.eqLinha.inativo>span{color:var(--muted)}
details.avancado summary{cursor:pointer;list-style:none}details.avancado summary::-webkit-details-marker{display:none}details.avancado summary h2{border-left:5px solid var(--lima);padding-left:8px}details.avancado:not([open]){gap:0}
button.cancelarBtn{background:var(--bad);border-color:var(--bad);color:#fff;font-size:1.1rem;padding:14px}
.janela.alerta{border-top-color:var(--bad);background:#fff5f4}
.janela.alerta h3{color:var(--bad)}
/* nomes das fazendas em maiúsculo em todos os filtros */
.escolha:not(.eq) button,#hFaz button,#eF button,#xF button,#jF button,.estTopo b,.fzCab b{text-transform:uppercase}
.escolha button small{text-transform:none}
.cam{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.camTopo{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff;font-weight:700;font-size:1.1rem;text-align:center;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.camBase{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));background:#000}
.camBase button{min-width:92px;background:#222;color:#fff;border-color:#444}
.camDisparo{width:76px!important;min-width:76px!important;height:76px;border-radius:50%!important;background:#fff!important;border:6px solid #9a9a9a!important;padding:0}
.camMinis{display:flex;gap:6px;justify-content:center;padding:0 0 8px;background:#000}.camMinis img{width:56px;height:42px;object-fit:cover;border-radius:6px;border:2px solid #fff}
/* Cadastros */
.cadeado{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.cadeado input{text-align:center;letter-spacing:.5em;font-size:2rem;font-weight:700}
.fzBloco{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fzCab{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(135deg,#0b3a82 0%,#1e88e5 100%);color:#fff;padding:10px 12px}
.fzCab b{font-family:var(--display);font-stretch:condensed;font-size:1.3rem}
.fzCab button{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.eqLinha{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
.eqLinha span{flex:1;font-weight:600}
.alca{font-style:normal;flex:none;width:30px;margin-left:-6px;text-align:center;font-size:1.35rem;line-height:1;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:6px 0}
.eqLinha.arrast{background:var(--chip);box-shadow:0 4px 14px rgba(13,71,161,.25);position:relative;z-index:2}
.fzCab button.az{font-size:.85rem;padding:4px 10px}
.addLinha{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
.addLinha input{flex:1;padding:8px 10px}
.mov{font-size:.85rem;padding:6px 0;border-bottom:1px solid var(--line)}
/* Janela (modal) */
.fundo{position:fixed;inset:0;background:rgba(17,37,61,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.janela{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--lima)}
.janela h3{margin:0;font-family:var(--display);font-stretch:condensed;font-size:1.5rem}
/* ---- Piscicultura ---- */
button.gVend{background:#1e88e5;border-color:#1e88e5;color:#fff}
button.gRec{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
button.gDesp{background:#00838f;border-color:#00838f;color:#fff}
button.gCad{background:#0b2545;border-color:#0b2545;color:#fff}
.inicio .lanc{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
.inicio .lanc b{color:var(--fg)}
.item{border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fbfcfe}
.item.atual{border-color:var(--lima)}
.itemTopo{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.itemTopo b{font-family:var(--display);font-stretch:condensed;font-size:1.25rem;line-height:1.1}
.itemTopo small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.precoLinha{display:flex;align-items:center;gap:8px}.precoLinha input{flex:1;font-weight:700;font-size:1.2rem;text-align:center}
.precoLinha span{font-weight:700;color:var(--muted);white-space:nowrap}
.pesadas{display:flex;flex-wrap:wrap;gap:6px}
.pesadas button{padding:6px 10px;border-radius:99px;font-variant-numeric:tabular-nums;font-size:.95rem;background:var(--chip);border-color:var(--chip)}
.pesadas button i{font-style:normal;color:var(--muted);font-size:.75rem;margin-right:4px}
.pesoLinha{display:flex;gap:8px;align-items:stretch}.pesoLinha input{flex:1;min-width:0}.pesoLinha button{flex:none;font-size:1.15rem;padding:0 16px}
.subtot{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;background:var(--chip);border-radius:10px;padding:8px 12px}
.totVenda{background:linear-gradient(135deg,#0b3a82 0%,#1e88e5 100%);color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.totVenda small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.totVenda b{font-family:var(--display);font-stretch:condensed;font-size:1.9rem;line-height:1;white-space:nowrap}
.sit{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap;vertical-align:middle;text-transform:uppercase;letter-spacing:.03em}
.sit.quit{background:#2e7d32}.sit.avenc{background:#1565c0}.sit.vence3{background:#ef6c00}.sit.venc{background:#c62828}.sit.vinho{background:#6d1b2b}
.tabela{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.tabela th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 4px}
.tabela td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
.tabela .r{text-align:right;white-space:nowrap}.tabela tr.tot td{font-weight:800;background:var(--chip)}
.tabWrap{overflow-x:auto;margin:0 -4px}
.kv{display:flex;flex-direction:column}.kv>div{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}
.kv>div span{color:var(--muted);font-weight:600}.kv>div b{font-variant-numeric:tabular-nums;text-align:right}
.kv>div.forte{background:var(--chip);border-radius:8px;padding:9px 10px;border:0;margin-top:4px}.kv>div.forte b{font-size:1.25rem}
.neg{color:var(--bad)!important}.pos{color:var(--verde)!important}
.aging{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.aging button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:#fff}
.aging button small{font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
.aging button b{font-family:var(--display);font-stretch:condensed;font-size:1.15rem;white-space:nowrap}
.aging button.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.cliLinha{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-radius:0;border-left:0;border-right:0;border-top:0;text-align:left;font-weight:400}
.cliLinha b{font-family:var(--display);font-stretch:condensed;font-size:1.2rem}.cliLinha small{display:block;color:var(--muted);font-size:.8rem}
.cliLinha .val{text-align:right;font-family:var(--display);font-stretch:condensed;font-size:1.3rem;font-weight:700;white-space:nowrap}
.busca{position:relative}.busca input{padding-left:38px}.busca::before{content:'🔎';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:1rem}
.escolha.cli{grid-template-columns:repeat(2,1fr)}
.escolha.cli button.venc{border-color:var(--bad)}
.estado{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:800;font-size:.8rem}
.estado.aberta{background:#e6f4ea;color:#1f6b3a}.estado.fechada{background:#fde7e6;color:var(--bad)}
.quebra{border-radius:12px;padding:12px;font-weight:700;text-align:center}
.quebra.ok{background:#e6f4ea;color:#1f6b3a}.quebra.at{background:#fff4e0;color:var(--warn)}.quebra.ruim{background:#fde7e6;color:var(--bad)}
.secTit{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 0 -6px}
.quem{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:.9rem}
.quem button{padding:4px 10px;font-size:.85rem}
select.sel2{font-size:1rem}
.stat b{font-size:clamp(1rem,4.6vw,1.6rem)!important;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
.pesoLinha input.big{font-size:1.8rem}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   FJK PISCICULTURA — vendas, conta corrente, despesca, custos e acerto
   Mesma base dos apps Gestão de Tratos / Abastecimentos:
   funciona sem internet (guarda no aparelho) e envia para a nuvem
   (Google Script) assim que o sinal volta.
   ===================================================================== */
const SENHA='0000';
const PRAZO=5*60*1000; // quem lançou pode editar/excluir por 5 minutos sem senha
const API_PADRAO=''; // link do Google Script (/exec) — colar aqui depois de publicar o Code.gs
const VERSAO='1';
const K={cad:'pc_cad',db:'pc_db',fila:'pc_fila',pend:'pc_pend',api:'pc_api',disp:'pc_disp',quem:'pc_quem',rascV:'pc_rascV',sync:'pc_sync',gest:'pc_gestOk'};
const TABS=['vendas','receb','ajustes','bags','doacoes','custos','repasses'];
const CATS=['Ração','Oxigênio / Aeração','Combustível / Transporte','Gelo','Mão de obra (fixa)','Mão de obra (diárias)','Insumos veterinários','Energia elétrica','Manutenção / Equipamentos','Alimentação','Hospedagem','Despesas administrativas','Investimentos','Outros'];
const CONDICOES=['A PRAZO','PIX','DINHEIRO','CARTÃO','BOLETO'];
const FORMAS=['PIX','DINHEIRO','TRANSFERÊNCIA','DEPÓSITO','CARTÃO','CHEQUE'];
const FAIXAS=[[1,15,'01 a 15 dias'],[16,30,'16 a 30 dias'],[31,60,'31 a 60 dias'],[61,90,'61 a 90 dias'],[91,1e9,'acima de 90 dias']];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEMANA=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ler(k,p){try{const v=JSON.parse(localStorage.getItem(k));return v??p}catch(e){return p}}
function gravar(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Memória do aparelho cheia')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const agora=()=>new Date().toISOString();
function chaveDia(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dDe(k){const[y,m,d]=String(k).split('-').map(Number);return new Date(y,m-1,d)}
function fmtData(k){if(!k)return'';const[y,m,d]=String(k).slice(0,10).split('-');return d+'/'+m+'/'+y}
function fmtDM(k){if(!k)return'';const[,m,d]=String(k).split('-');return d+'/'+m}
function fmtHora(iso){const d=new Date(iso);return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtDH(iso){const d=new Date(iso);return isNaN(d)?'':fmtData(chaveDia(d))+' '+fmtHora(iso)}
function somaDias(k,n){const d=dDe(k);d.setDate(d.getDate()+Number(n||0));return chaveDia(d)}
function difDias(a,b){return Math.round((dDe(b)-dDe(a))/86400000)} // b - a
function nomeDia(k){return SEMANA[dDe(k).getDay()]}
const r2=n=>Math.round((Number(n)||0)*100+Number.EPSILON*100)/100;
const r3=n=>Math.round((Number(n)||0)*1000)/1000;
const fmtR=n=>(n==null||isNaN(n))?'—':'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN2=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtKg=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
const fmtI=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const fmtP=n=>(isFinite(n)?Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2}):'0')+'%';
const numBR=s=>{s=String(s??'').trim().replace(/[^\d.,-]/g,'');if(!s)return NaN;if(/,/.test(s))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const txtBR=(n,d=2)=>(n==null||isNaN(n)||n==='')?'':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d,useGrouping:false});
const ordTxt=(a,b)=>String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'});
const semAcento=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- Semana da despesca (segunda a domingo; a semana é do mês da segunda) ---------- */
function segundaDe(k){const d=dDe(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return chaveDia(d)}
function semanaDoMes(seg){const d=dDe(seg);const p=new Date(d.getFullYear(),d.getMonth(),1);const desl=(7-((p.getDay()+6)%7))%7;const ps=new Date(p);ps.setDate(1+desl);return Math.max(1,Math.floor((d-ps)/604800000+1e-9)+1)}
function descSemana(k){const s=segundaDe(k),dom=somaDias(s,6),d=dDe(s);const m=MESES[d.getMonth()];return `${m[0].toUpperCase()+m.slice(1)} ${d.getFullYear()} | Semana ${semanaDoMes(s)} (${fmtDM(s)} a ${fmtData(dom)})`}

}

/* ---------- Vendas: peso, valor e conta corrente ---------- */
const pesoItem=i=>r3((i.pesadas||[]).reduce((s,p)=>s+Number(p||0),0));
const valorItem=i=>r2(pesoItem(i)*Number(i.preco||0));
const pesoVenda=v=>r3((v.itens||[]).reduce((s,i)=>s+pesoItem(i),0));
const valorVenda=v=>r2((v.itens||[]).reduce((s,i)=>s+valorItem(i),0));

function movimentos(cliId){
  const m=[];
  db.vendas.filter(v=>v.clienteId===cliId).forEach(v=>m.push({data:v.data,ordem:1,tipo:'VENDA',ref:v.id,rec:v,hist:numVenda(v)+(v.nf?' (NF '+v.nf+')':'')+' — '+descItens(v),debito:valorVenda(v),credito:0,peso:pesoVenda(v),venc:v.venc||v.data,despescaId:v.despescaId}));
  db.ajustes.filter(a=>a.clienteId===cliId).forEach(a=>m.push({data:a.data,ordem:2,tipo:a.tipo==='D'?'DEBITO':'CREDITO',ref:a.id,rec:a,hist:(a.tipo==='D'?'Débito — ':'Crédito/desconto — ')+(a.desc||''),debito:a.tipo==='D'?Number(a.valor):0,credito:a.tipo==='C'?Number(a.valor):0,peso:0,venc:a.venc||a.data}));
  db.receb.filter(p=>p.clienteId===cliId).forEach(p=>m.push({data:p.data,ordem:3,tipo:'PAGAMENTO',ref:p.id,rec:p,hist:'Recebimento'+(p.forma?' — '+p.forma:'')+(p.doc?' (doc. '+p.doc+')':'')+(p.obs?' — '+p.obs:''),debito:0,credito:Number(p.valor),peso:0,venc:p.data}));
  m.sort((a,b)=>String(a.data).localeCompare(String(b.data))||a.ordem-b.ordem||String(a.rec.registradoEm||'').localeCompare(String(b.rec.registradoEm||'')));
  let s=0;m.forEach(x=>{s=r2(s+x.debito-x.credito);x.saldo=s});return m;
}
function faixaDe(d){for(const[a,b,r]of FAIXAS)if(d>=a&&d<=b)return r;return''}
/* baixa automática FIFO: os créditos quitam os títulos mais antigos primeiro */
function titulos(cliId,ref=chaveDia(),movs){
  movs=movs||movimentos(cliId);const out=[];
  // o que foi pago na própria venda (à vista) quita primeiro aquela venda; o resto segue a ordem FIFO
  const lig={},ids=new Set(movs.filter(m=>m.debito>0).map(m=>m.ref));let cred=0;
  movs.forEach(m=>{if(m.credito<=0)return;const vid=m.rec&&m.rec.vendaId;if(vid&&ids.has(vid))lig[vid]=r2((lig[vid]||0)+m.credito);else cred=r2(cred+m.credito)});
  const ap1={};movs.forEach(m=>{if(m.debito>0&&lig[m.ref]){const a=Math.min(lig[m.ref],m.debito);ap1[m.ref]=a;cred=r2(cred+lig[m.ref]-a)}});
  for(const m of movs){if(m.debito<=0)continue;const resto=r2(m.debito-(ap1[m.ref]||0));const apF=Math.min(cred,resto);cred=r2(cred-apF);const ap=r2((ap1[m.ref]||0)+apF);const ab=r2(m.debito-ap);
    const sit=ab<=0.004?'QUITADA':ap>0?'PARCIAL':'EM ABERTO';const atraso=ab>0.004?Math.max(0,difDias(m.venc,ref)):0;
    out.push({...m,valor:m.debito,pago:r2(ap),aberto:ab,sit,atraso,faixa:ab>0.004&&atraso>0?faixaDe(atraso):''})}
  return out;
}
function posicao(cliId,movs){movs=movs||movimentos(cliId);const t=titulos(cliId,undefined,movs);const tol=Number(cad.params.tolerancia||0);
  const ab=t.filter(x=>x.aberto>0.004);const vencidos=ab.filter(x=>x.atraso>tol);
  return{saldo:movs.length?movs[movs.length-1].saldo:0,aberto:r2(ab.reduce((s,x)=>s+x.aberto,0)),vencido:r2(vencidos.reduce((s,x)=>s+x.aberto,0)),maiorAtraso:vencidos.reduce((m,x)=>Math.max(m,x.atraso),0),titulos:t,abertos:ab,vencidos}}
/* cor financeira: verde quitado · azul a vencer · laranja vence em 3 dias · vermelho vencido · vinho +30 dias */
function sitTag(t){
  if(t.aberto<=0.004)return'<span class="sit quit">Quitada</span>';
  if(t.atraso>30)return`<span class="sit vinho">${t.atraso} dias</span>`;
  if(t.atraso>0)return`<span class="sit venc">Vencida ${t.atraso}d</span>`;
  const f=difDias(chaveDia(),t.venc);if(f<=3)return`<span class="sit vence3">${f<=0?'Vence hoje':'Vence em '+f+'d'}</span>`;
  return`<span class="sit avenc">${t.sit==='PARCIAL'?'Parcial · ':''}A vencer</span>`;
}
function sitVenda(v){const t=titulos(v.clienteId).find(x=>x.ref===v.id);return t?sitTag(t):''}

let senhaDig='',senhaRes=null;

const fimSenha=v=>{const r=senhaRes;senhaRes=null;verSenha(false);senhaDig='';if(r)r(v)};
$('senhaFundo').onclick=()=>fimSenha(false);
$('tecSenha').addEventListener('pointerdown',e=>e.preventDefault());
$('tecSenha').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(!b)return;const k=b.dataset.s;
  if(k==='cancelar'){fimSenha(false);return}

  e.preventDefault();const b=$('tecSenha').querySelector(`button[data-s="${k}"]`);if(b)b.click()});

  document.body.appendChild(f);const fechar=()=>f.remove();
  f.onclick=e=>{if(e.target===f)fechar()};if(montar)montar(f.firstChild,fechar);return fechar;
}

/* ---------- Datas no formato 30/10/2026 ---------- */
const _vDesc=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
function mascaraData(inp){
  if(inp.dataset.mask)return;inp.dataset.mask='1';
  const box=document.createElement('span');box.className='dataBox';inp.parentNode.insertBefore(box,inp);box.appendChild(inp);
  const txt=document.createElement('span');txt.className='dataTxt';box.insertBefore(txt,inp);
  const upd=()=>{const v=_vDesc.get.call(inp);txt.textContent=v?fmtData(v):'dd/mm/aaaa';txt.classList.toggle('vazio',!v)};
  Object.defineProperty(inp,'value',{configurable:true,get(){return _vDesc.get.call(inp)},set(v){_vDesc.set.call(inp,v);upd()}});
  inp.addEventListener('input',upd);inp.addEventListener('change',upd);upd();
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches&&n.matches('input[type=date]'))mascaraData(n);n.querySelectorAll&&n.querySelectorAll('input[type=date]').forEach(mascaraData)}))).observe(document.body,{childList:true,subtree:true});

/* ---------- Compartilhar ---------- */
function baixar(blob,nome){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function compartilharArquivo(blob,nome,tipo){
  const f=new File([blob],nome,{type:tipo});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:nome});return}catch(e){if(e.name==='AbortError')return}}
  baixar(blob,nome);toast('Arquivo salvo em Downloads');
}
function foneWa(t){let d=String(t||'').replace(/\D/g,'');if(!d)return'';if(d.length<=11)d='55'+d;return d}
async function compartilharTexto(txt,fone){
  const f=foneWa(fone);
  if(f){window.open('https://wa.me/'+f+'?text='+encodeURIComponent(txt),'_blank');return}
  if(navigator.share){try{await navigator.share({text:txt});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(txt);toast('Texto copiado — cole no WhatsApp')}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
}
const nomeArq=s=>String(s).replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim();

/* =====================================================================
   RELATÓRIOS: PDF (páginas A4 desenhadas), Excel (.xlsx) e texto WhatsApp
   rel = {titulo, sub, blocos:[ {kv:[[rótulo,valor,cor?,forte?]]} |
          {tit, cols:[{t,w,al}], linhas:[[...]], total:[...]} | {txt} ]}
   ===================================================================== */
const RW=1000,RS=2,MX=40,AZ='#0d47a1',AZ2='#e3eefb',TX='#11253d',MU='#5d6b7a';
const MED=document.createElement('canvas').getContext('2d');
function cortar(c,t,w){t=String(t??'');if(c.measureText(t).width<=w)return t;while(t&&c.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function quebrar(c,t,w){const out=[];String(t||'').split('\n').forEach(par=>{let l='';par.split(/\s+/).forEach(p=>{const x=l?l+' '+p:p;if(c.measureText(x).width>w&&l){out.push(l);l=p}else l=x});out.push(l)});return out}
function itensRel(rel){
  const it=[];
  for(const b of rel.blocos){
    if(b.tit)it.push({k:'sec',h:46,t:b.tit});

function aplicaFila(){
  for(const f of fila){
    if(f.acao==='salvar'){const l=db[f.tab];const i=l.findIndex(x=>x.id===f.dados.id);if(i>=0)l[i]=f.dados;else l.push(f.dados)}
    if(f.acao==='excluir')db[f.tab]=db[f.tab].filter(x=>x.id!==f.id);
    if(f.acao==='cadastros')cad=f.dados;
  }
}
async function carregar(){
  if(!apiUrl()){statusNuvem();return}
  $('btnAtualizar').classList.add('girando');
  try{
    await enviarFila();
    if(fila.length)throw new Error('fila');
    const j=await (await fetch(apiUrl()+'?acao=listar',{cache:'no-store'})).json();
    if(!j.ok)throw new Error(j.erro);
    if(j.cadastros&&j.cadastros.produtos)cad=j.cadastros;
    else if(!fila.some(f=>f.acao==='cadastros'))salvarCad(); // primeira vez: manda os cadastros iniciais
    garanteCad();
    TABS.forEach(t=>db[t]=(j.dados&&j.dados[t])||[]);aplicaFila();
    gravar(K.cad,cad);gravar(K.db,db);online=true;marcaAtualizado(agora());
  }catch(e){online=false}
  $('btnAtualizar').classList.remove('girando');
  if(!document.querySelector('.fundo')&&!ocupado())render();else statusNuvem();
}

let tela='inicio';
const TITULOS={inicio:'Piscicultura',gest:'Gestão',vend:'Vender',rec:'Receber',desp:'Despesca',gvend:'Vendas',gcli:'Clientes / Extrato',extr:'Extrato do Cliente',gcob:'Cobrança',gfech:'Fechamento da Despesca',gcust:'Custos',gacer:'Acerto com a Fazenda',gdoa:'Doações',gpeix:'Peixes e Tanques',gconf:'Configurações'};
const DA_GESTAO=['gvend','gcli','extr','gcob','gfech','gcust','gacer','gdoa','gpeix','gconf'];
const FORMS=['vend','rec','desp']; // telas de lançamento: não redesenha sozinha enquanto a pessoa digita
const ENTRAR={},RENDER={},ACOES={},CAMPOS={};
let manterForm=false;
function ir(t){
  document.querySelectorAll('.fundo').forEach(x=>x.remove());
  tela=t;document.body.classList.toggle('naInicio',t==='inicio');
  document.querySelectorAll('.tela').forEach(e=>e.hidden=e.id!=='t-'+t);
  $('titulo').textContent=TITULOS[t]||'Piscicultura';
  if(t==='inicio'){cadLiberado=false;marcaQuem()}
  else if(ENTRAR[t]&&!manterForm)ENTRAR[t]();
  manterForm=false;render();window.scrollTo(0,0);
}
function render(){if(RENDER[tela])RENDER[tela]();statusNuvem()}
const ocupado=()=>FORMS.concat(['gcust','gacer','gdoa','gpeix','gconf']).includes(tela)||['INPUT','TEXTAREA','SELECT'].includes((document.activeElement||{}).tagName);
document.querySelectorAll('[data-ir]').forEach(b=>b.onclick=async()=>{const t=b.dataset.ir;
  if(FORMS.includes(t)){if(!quem()){escolherQuem(()=>ir(t));return}ir(t);return}
  if(t==='gest'){if(gestaoLiberada()||await pedirSenhaTec('Senha da Gestão')){liberaGestao();ir('gest')}return}
  if(cadLiberado||gestaoLiberada()||await pedirSenhaTec('Senha da Gestão')){liberaGestao();ir(t)}});
$('btnVoltar').onclick=()=>ir(tela==='extr'?'gcli':DA_GESTAO.includes(tela)?'gest':'inicio');
/* ações e campos das telas (data-a = botão, data-f = campo) */
$('wrap').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==='quem'){escolherQuem(render);return}
  const f=(ACOES[tela]||{})[a];if(f){e.preventDefault();f(b.dataset.v,b,e)}});
['input','change'].forEach(ev=>$('wrap').addEventListener(ev,e=>{const el=e.target.closest('[data-f]');if(!el)return;const f=CAMPOS[tela];if(f)f(el.dataset.f,el,ev)}));
$('wrap').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const el=e.target.closest('[data-enter]');if(!el)return;e.preventDefault();const f=(ACOES[tela]||{})[el.dataset.enter];if(f)f(el.dataset.v,el,e)});

const dataHtml=(f,v,tit='Data')=>`<div class="passo"><label>${tit}</label><div class="dataLinha ${v!==chaveDia()?'outra':''}"><input type="date" data-f="${f}" value="${v}"></div>${v!==chaveDia()?`<p class="note" style="color:var(--warn)">⚠️ Data diferente de hoje (${nomeDia(v)})</p>`:''}</div>`;
function despHtml(k){const d=despescaDaData(k,false);
  return `<div class="resumoSel" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span>📦 ${esc(d?d.descricao:descSemana(k))}</span>${d&&d.encerrada?'<span class="estado fechada">ENCERRADA</span>':'<span class="estado aberta">ABERTA</span>'}</div>${d&&d.encerrada?'<p class="note" style="color:var(--bad)">Esta despesca está encerrada: não aceita lançamentos. Para lançar, reabra em Gestão → Fechamento.</p>':''}`}
const despFechada=k=>{const d=despescaDaData(k,false);return !!(d&&d.encerrada)};
function clientesGrade(busca,sel,opc={}){
  let l=ativos(cad.clientes).filter(c=>opc.doacao?c.doacao:(c.cliente!==false));
  const q=semAcento(busca);if(q)l=l.filter(c=>semAcento(c.nome+' '+(c.apelido||'')+' '+(c.cidade||'')+' '+(c.bairro||'')).includes(q));
  const pos={};l.forEach(c=>pos[c.id]=posicao(c.id));
  if(opc.porSaldo)l.sort((a,b)=>pos[b.id].aberto-pos[a.id].aberto||ordTxt(a.nome,b.nome));else l.sort((a,b)=>ordTxt(a.nome,b.nome));
  const tot=l.length;l=l.slice(0,q?40:24);
  return `<div class="busca"><input type="text" data-f="busca" value="${esc(busca||'')}" placeholder="Buscar cliente (nome, apelido, cidade)" autocomplete="off"></div>
  ${l.length?`<div class="escolha cli">${l.map(c=>{const p=pos[c.id];return `<button data-a="cli" data-v="${c.id}" class="${c.id===sel?'sel':''} ${p.vencido>0?'venc':''}">${esc(c.nome)}<small>${c.apelido?esc(c.apelido)+' · ':''}${p.aberto>0.004?(p.vencido>0?'⚠️ ':'')+fmtR(p.aberto):'sem débito'}</small></button>`}).join('')}</div>`:`<div class="vazio">${q?'Nenhum cliente encontrado.':'Nenhum cliente cadastrado.'}</div>`}
  ${tot>l.length?`<p class="note">Mostrando ${l.length} de ${tot}. Digite para buscar.</p>`:''}
  <button class="lima" data-a="cliNovo">+ Novo cliente</button>`;
}
function atualizaBusca(el,html){/* redesenha só a grade, mantendo o cursor no campo de busca */
  const box=el.closest('.cliBox');if(!box)return;const pos=el.selectionStart;box.innerHTML=html;const i=box.querySelector('[data-f=busca]');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}}

   <div class="datas"><div><label>Cidade</label><input type="text" id="cC" value="${esc(c.cidade||'')}"></div><div><label>Bairro</label><input type="text" id="cB" value="${esc(c.bairro||'')}"></div></div>

      if(n){c.id='cl-'+uid();c.precos={};cad.clientes.push(c)}toque(c);salvarCad(n?'Cliente cadastrado':'Cliente salvo');fechar();ok&&ok(c)};

  const p=posicao(c.id);if(!cad.params.alerta||p.vencido<=0){ok();return}
  janela(`<h3>⚠️ Cliente com título vencido</h3>
    <div class="kv"><div><span>Cliente</span><b>${esc(nomeCli(c))}</b></div><div><span>Vencido</span><b class="neg">${fmtR(p.vencido)}</b></div><div><span>Maior atraso</span><b class="neg">${p.maiorAtraso} dias</b></div><div><span>Total em aberto</span><b>${fmtR(p.aberto)}</b></div></div>
    <table class="tabela"><tr><th>Título</th><th>Venc.</th><th class="r">Aberto</th></tr>${p.vencidos.slice(0,6).map(t=>`<tr><td>${esc(t.tipo==='VENDA'?numCurto(t.rec):'Ajuste')}</td><td>${fmtData(t.venc)}</td><td class="r">${fmtR(t.aberto)}</td></tr>`).join('')}</table>
    ${cad.params.bloquear?'<p class="note" style="color:var(--bad)">Venda bloqueada para cliente inadimplente — só continua com a senha.</p>':''}
    <div class="row"><button id="jN">Voltar</button><button class="primary" id="jS" style="background:var(--bad);border-color:var(--bad)">${cad.params.bloquear?'🔒 Liberar com senha':'Continuar mesmo assim'}</button></div>`,(j,fechar)=>{
    j.querySelector('#jN').onclick=fechar;
    j.querySelector('#jS').onclick=async()=>{fechar();if(cad.params.bloquear){if(await pedirSenhaTec('Senha para liberar a venda'))ok()}else ok()};
  },'alerta');

function escolherClasse(ok){
  const prods=ativos(cad.produtos);
  janela(`<h3>🐟 Peixe e classificação</h3><div id="jP" class="escolha">${prods.map(p=>`<button data-p="${p.id}">${esc(p.nome)}</button>`).join('')}</div><div id="jCl"></div><button id="jF">Fechar</button>`,(j,fechar)=>{
    const mostra=pid=>{j.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('sel',b.dataset.p===pid));
      const cs=classesDo(pid);j.querySelector('#jCl').innerHTML=cs.length?`<label>Classificação</label><div class="escolha eq" style="grid-template-columns:repeat(2,1fr)">${cs.map(c=>`<button data-c="${c.id}">${esc(c.nome)}${c.preco?`<small>ref. ${fmtR(c.preco)}/kg</small>`:''}</button>`).join('')}</div>`:'<div class="vazio">Sem classificação cadastrada para este peixe (Gestão → Peixes e Tanques).</div>';
      j.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{fechar();ok(classePorId(b.dataset.c))})};
    j.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>mostra(b.dataset.p));
    if(prods.length===1)mostra(prods[0].id);
    j.querySelector('#jF').onclick=fechar;
  });
}

let fv=null;
function fvNovo(){return{editId:null,data:chaveDia(),cliId:null,itens:[],ia:-1,cond:'A PRAZO',venc:'',vencManual:false,recebido:true,nf:'',obs:'',busca:''}}
function rascV(){if(fv&&!fv.editId)gravar(K.rascV,fv)}
ENTRAR.vend=()=>{fv=fvNovo();const r=ler(K.rascV,null);
  if(r&&r.itens&&r.itens.some(i=>(i.pesadas||[]).length)){setTimeout(()=>janela(`<h3>📝 Venda em andamento</h3><p class="note">Ficou uma venda sem gravar${r.cliId&&cliPorId(r.cliId)?' para <b>'+esc(cliPorId(r.cliId).nome)+'</b>':''} (${r.itens.reduce((s,i)=>s+(i.pesadas||[]).length,0)} pesadas). Quer continuar?</p><div class="row"><button id="jD">Descartar</button><button class="primary" id="jC">Continuar</button></div>`,(j,fechar)=>{
    j.querySelector('#jD').onclick=()=>{localStorage.removeItem(K.rascV);fechar()};j.querySelector('#jC').onclick=()=>{fv=r;fechar();render()}}),50)}
};
function vencPadrao(){const c=cliPorId(fv.cliId);return somaDias(fv.data,c?Number(c.prazo||0):Number(cad.params.prazo||0))}
RENDER.vend=()=>{
  const el=$('t-vend'),c=cliPorId(fv.cliId);if(!fv.vencManual)fv.venc=fv.cliId?vencPadrao():'';
  let h=quemHtml()+(fv.editId?`<div class="leitura aviso">✏️ Editando ${esc(numVenda(fv))} — grave para salvar as alterações.</div>`:'');
  h+=`<section class="panel"><h2>Data e despesca</h2>${dataHtml('data',fv.data)}${despHtml(fv.data)}</section>`;
  h+=`<section class="panel"><h2>Cliente</h2>`;
  if(c){const p=posicao(c.id);h+=`<div class="resumoSel" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>👤 ${esc(nomeCli(c))}<br><small style="font-weight:500">Em aberto: <b class="${p.vencido>0?'neg':''}">${fmtR(p.aberto)}</b>${p.vencido>0?` · vencido ${fmtR(p.vencido)}`:''} · prazo ${c.prazo||0} dias</small></span><button class="mini" data-a="cliTroca">Trocar</button></div>`}
  else h+=`<div class="cliBox">${clientesGrade(fv.busca,null)}</div>`;
  h+=`</section>`;
  if(c){
    h+=`<section class="panel"><h2>Peixes e pesadas</h2>`;
    fv.itens.forEach((i,ix)=>{const neg=c.precos&&c.precos[i.classeId]!=null;h+=`<div class="item ${ix===fv.ia?'atual':''}">
      <div class="itemTopo"><div><b>${esc(i.produto)} — ${esc(i.classe)}</b><small>${neg?'Preço negociado com o cliente: '+fmtR(c.precos[i.classeId]):'Sem preço negociado'+(classePorId(i.classeId)&&classePorId(i.classeId).preco?' · ref. '+fmtR(classePorId(i.classeId).preco):'')}</small></div><button class="mini danger" data-a="itemDel" data-v="${ix}">✕</button></div>
      <div class="precoLinha"><span>R$</span><input type="text" inputmode="decimal" data-f="preco" data-i="${ix}" value="${txtBR(i.preco)}" placeholder="0,00"><span>/kg</span></div>
      ${(i.pesadas||[]).length?`<div class="pesadas">${i.pesadas.map((p,pj)=>`<button data-a="pesEd" data-v="${ix}:${pj}"><i>${pj+1}</i>${fmtKg(p)}</button>`).join('')}</div>`:'<p class="note">Nenhuma pesada ainda.</p>'}
      ${ix===fv.ia?`<div class="pesoLinha"><input type="text" class="big" id="pesoIn" inputmode="decimal" placeholder="Peso (kg)" autocomplete="off" data-enter="pesAdd"><button class="verde" data-a="pesAdd">+ Pesada</button></div>`:`<button data-a="itemSel" data-v="${ix}">⚖️ Lançar pesadas neste item</button>`}
      <div class="subtot"><span id="stq${ix}">${(i.pesadas||[]).length} pesada(s) · ${fmtKg(pesoItem(i))} kg</span><span id="stv${ix}">${fmtR(valorItem(i))}</span></div></div>`});
    h+=`<button class="lima" data-a="itemNovo">+ Peixe / classificação</button></section>`;
    h+=`<section class="panel"><h2>Pagamento</h2><div class="chips">${CONDICOES.map(x=>`<button data-a="cond" data-v="${x}" class="${fv.cond===x?'sel':''}">${x}</button>`).join('')}</div>
      ${fv.cond!=='A PRAZO'?`<label class="opcao"><input type="checkbox" data-f="recebido" ${fv.recebido?'checked':''}> Já recebido agora (a venda entra quitada)</label>`:''}
      <div class="datas"><div><label>Vencimento</label><input type="date" data-f="venc" value="${fv.venc}"></div><div><label>Nº nota (opcional)</label><input type="text" data-f="nf" value="${esc(fv.nf)}"></div></div>
      <p class="note">Vencimento automático: data da venda + prazo do cliente (${c.prazo||0} dias).</p>
      <div><label>Observação</label><input type="text" data-f="obs" value="${esc(fv.obs)}"></div></section>`;
    h+=`<div class="totVenda"><div><small>Peso total</small><b id="tvP">${fmtKg(pesoVenda(fv))} kg</b></div><div style="text-align:right"><small>Valor da venda</small><b id="tvV">${fmtR(valorVenda(fv))}</b></div></div>
      <div class="row"><button class="cancelarBtn" data-a="cancelar">Cancelar</button><button class="verde" data-a="gravar" style="flex:2 1 auto">✔ GRAVAR VENDA</button></div>`;
  }
  h+=recentesHtml('vendas',v=>`<b>${esc(v.cliente)}</b><span class="litros">${fmtR(valorVenda(v))}</span>`,v=>`${fmtKg(pesoVenda(v))} kg · ${esc(numVenda(v))}`);
  el.innerHTML=h;
};
function recentesHtml(tab,topo,linha){const r=recentes(tab);if(!r.length)return'';
  return `<details class="panel pend" open><summary><h2>Lançados agora (editar até 5 min)</h2><span class="seta">▾</span></summary>${r.map(({p,a})=>`<div class="pendItem"><div class="pendTopo">${topo(a)}</div><div class="note">${linha(a)} · <span class="relogio" data-em="${p.em}">${mmss(restante(p))}</span></div><div class="row"><button class="mini" data-a="recEd" data-v="${a.id}">✏️ Editar</button><button class="mini danger" data-a="recDel" data-v="${a.id}">🗑 Excluir</button></div></div>`).join('')}</details>`}
function updTotVend(){fv.itens.forEach((i,ix)=>{const q=$('stq'+ix),v=$('stv'+ix);if(q)q.textContent=`${(i.pesadas||[]).length} pesada(s) · ${fmtKg(pesoItem(i))} kg`;if(v)v.textContent=fmtR(valorItem(i))});
  if($('tvP'))$('tvP').textContent=fmtKg(pesoVenda(fv))+' kg';if($('tvV'))$('tvV').textContent=fmtR(valorVenda(fv));rascV()}
const focaPeso=()=>setTimeout(()=>{const i=$('pesoIn');if(i)i.focus()},30);
CAMPOS.vend=(f,el,ev)=>{
  if(f==='busca'){fv.busca=el.value;atualizaBusca(el,clientesGrade(fv.busca,null));return}
  if(f==='data'&&ev==='change'){if(!el.value)return;fv.data=el.value;render();rascV();return}
  if(f==='venc'&&ev==='change'){fv.venc=el.value;fv.vencManual=true;rascV();return}
  if(f==='preco'){const i=fv.itens[+el.dataset.i];const n=numBR(el.value);i.preco=isNaN(n)?0:n;updTotVend();return}
  if(f==='recebido'){fv.recebido=el.checked;rascV();return}
  if(f==='nf'||f==='obs'){fv[f]=el.value;rascV()}
};
ACOES.vend={
  cli(id){const c=cliPorId(id);checarInadimplente(c,()=>{fv.cliId=id;fv.busca='';fv.vencManual=false;
    if(!fv.itens.length){render();ACOES.vend.itemNovo()}else{fv.itens.forEach(i=>{if(c.precos&&c.precos[i.classeId]!=null)i.preco=c.precos[i.classeId]});render()}rascV()})},
  cliTroca(){fv.cliId=null;fv.vencManual=false;render()},
  cliNovo(){formCliente(null,c=>{fv.cliId=c.id;fv.busca='';render();if(!fv.itens.length)ACOES.vend.itemNovo()})},
  itemNovo(){escolherClasse(cl=>{const c=cliPorId(fv.cliId),p=prodPorId(cl.produtoId);
    const ja=fv.itens.findIndex(i=>i.classeId===cl.id);if(ja>=0){fv.ia=ja;render();focaPeso();return}
    fv.itens.push({id:uid(),classeId:cl.id,produtoId:cl.produtoId,produto:p?p.nome:'',classe:cl.nome,preco:(c&&c.precos&&c.precos[cl.id]!=null)?c.precos[cl.id]:Number(cl.preco||0),pesadas:[]});
    fv.ia=fv.itens.length-1;render();focaPeso();rascV()})},
  itemSel(v){fv.ia=+v;render();focaPeso()},
  itemDel(v){const i=fv.itens[+v];const tira=()=>{fv.itens.splice(+v,1);fv.ia=Math.min(fv.ia,fv.itens.length-1);render();rascV()};if((i.pesadas||[]).length)perguntar(`Remover ${i.produto} — ${i.classe} e suas ${i.pesadas.length} pesada(s)?`,'Remover','var(--bad)',tira);else tira()},
  pesAdd(){const inp=$('pesoIn');if(!inp)return;const n=numBR(inp.value);if(!(n>0)){toast('Digite o peso da pesada');inp.focus();return}if(n>3000){toast('Peso muito alto — confira');return}

function gravarVenda(){
  const c=cliPorId(fv.cliId);if(!c){toast('Escolha o cliente');return}
  if(despFechada(fv.data)){toast('Despesca encerrada — reabra na Gestão');return}
  const itens=fv.itens.filter(i=>(i.pesadas||[]).length);if(!itens.length){toast('Lance pelo menos uma pesada');return}
  if(itens.some(i=>!(Number(i.preco)>0))){toast('Informe o preço por kg de todos os itens');return}
  if(!fv.venc){toast('Informe o vencimento');return}
  const diverg=itens.filter(i=>!(c.precos&&Number(c.precos[i.classeId])===Number(i.preco)));
  const vai=salvaPreco=>{
    if(salvaPreco){c.precos=c.precos||{};diverg.forEach(i=>c.precos[i.classeId]=Number(i.preco));toque(c);salvarCad()}
    const d=despescaDaData(fv.data,true),antiga=fv.editId?db.vendas.find(x=>x.id===fv.editId):null;
    const v={...(antiga||{}),id:fv.editId||'vd-'+uid(),data:fv.data,despescaId:d.id,clienteId:c.id,cliente:c.nome,
      itens:itens.map(i=>({classeId:i.classeId,produtoId:i.produtoId,produto:i.produto,classe:i.classe,preco:Number(i.preco),pesadas:i.pesadas.slice()})),
      venc:fv.venc,cond:fv.cond,nf:fv.nf.trim(),obs:fv.obs.trim(),vendedor:antiga?antiga.vendedor:quem()};
    v.peso=pesoVenda(v);v.valor=valorVenda(v);
    salvarReg('vendas',v,!antiga);
    // recebido na hora: gera o recebimento junto (e acompanha a edição)
    const rv=db.receb.find(p=>p.vendaId===v.id);
    if(fv.cond!=='A PRAZO'&&fv.recebido){const p={...(rv||{}),id:rv?rv.id:'rc-'+uid(),data:v.data,clienteId:c.id,cliente:c.nome,valor:v.valor,forma:fv.cond==='CARTÃO'?'CARTÃO':fv.cond,doc:v.nf,obs:'Pago na venda',vendaId:v.id,vendedor:v.vendedor};salvarReg('receb',p,!rv)}
    else if(rv)apagarReg('receb',rv.id);
    localStorage.removeItem(K.rascV);
    const editou=!!antiga;fv=fvNovo();if(editou&&DA_GESTAO.includes(voltaEdicao)){const t=voltaEdicao;voltaEdicao='';ir(t);toast('Venda alterada')}else{render();window.scrollTo(0,0)}
    vendaGravada(v,editou);
  };
  if(diverg.length)janela(`<h3>💲 Preço diferente do negociado</h3><table class="tabela"><tr><th>Item</th><th class="r">Negociado</th><th class="r">Nesta venda</th></tr>${diverg.map(i=>`<tr><td>${esc(i.produto)} ${esc(i.classe)}</td><td class="r">${c.precos&&c.precos[i.classeId]!=null?fmtR(c.precos[i.classeId]):'—'}</td><td class="r"><b>${fmtR(i.preco)}</b></td></tr>`).join('')}</table>
    <p class="note">O preço fica gravado nesta venda e não muda com renegociações futuras.</p>
    <button class="primary" id="jS">Gravar e salvar como preço do cliente</button><button id="jU">Gravar só nesta venda</button><button id="jC">Voltar e corrigir</button>`,(j,fechar)=>{
    j.querySelector('#jS').onclick=()=>{fechar();vai(true)};j.querySelector('#jU').onclick=()=>{fechar();vai(false)};j.querySelector('#jC').onclick=fechar});
  else vai(false);
}
let voltaEdicao='';

function editarVenda(v,origem){

function excluirVenda(v,depois){

function textoNota(v){
  const P=cad.params,L=[`*${P.empresa}* — Nota de venda`,`_${P.unidade}_ · ${numVenda(v)}`,'',`Cliente: *${v.cliente}*`,`Data: ${fmtData(v.data)}   |   Vencimento: *${fmtData(v.venc)}*`,''];
  (v.itens||[]).forEach(i=>{L.push(`${i.produto} — ${i.classe}`);L.push(`   ${fmtKg(pesoItem(i))} kg × ${fmtR(i.preco)}/kg = *${fmtR(valorItem(i))}*`);L.push('   pesadas: '+(i.pesadas||[]).map(fmtKg).join(' + '))});
  L.push('',`*TOTAL DA NOTA: ${fmtR(valorVenda(v))}*`,`Peso total: ${fmtKg(pesoVenda(v))} kg`,`Condição: ${v.cond||'A PRAZO'}`);
  const p=posicao(v.clienteId);if(Math.abs(p.aberto-valorVenda(v))>0.004)L.push(`Saldo total em aberto: *${fmtR(p.aberto)}*`);

      total:['TOTAL',String((v.itens||[]).reduce((s,i)=>s+(i.pesadas||[]).length,0)),fmtKg(pesoVenda(v)),'',fmtR(valorVenda(v))]},

  if(p==='mesant'){st.de=chaveDia(new Date(d.getFullYear(),d.getMonth()-1,1));st.ate=chaveDia(new Date(d.getFullYear(),d.getMonth(),0))}

RENDER.gcob=()=>{
  const cart=carteira(),tol=Number(cad.params.tolerancia||0),fx={'A vencer':0};FAIXAS.forEach(f=>fx[f[2]]=0);
  cart.forEach(({t})=>{const k=t.atraso>0?t.faixa:'A vencer';fx[k]=r2((fx[k]||0)+t.aberto)});
  const tot=r2(Object.values(fx).reduce((s,v)=>s+v,0)),venc=r2(tot-fx['A vencer']);
  const l=cart.filter(({t})=>gb.faixa?(gb.faixa==='A vencer'?t.atraso<=0:t.faixa===gb.faixa):t.atraso>tol);
  const porCli={};l.forEach(x=>{(porCli[x.c.id]=porCli[x.c.id]||{c:x.c,l:[],v:0}).l.push(x.t);porCli[x.c.id].v=r2(porCli[x.c.id].v+x.t.aberto)});

    <section class="panel"><h2>${gb.faixa?esc(gb.faixa):'Títulos vencidos'} — ${grupos.length} cliente(s)</h2>${botoesExp()}`;

  h+=`</section>`;$('t-gcob').innerHTML=h;

function classificarQuebra(dif,base){if(!base)return['SEM DADOS','at'];const p=dif/base*100;
  if(p<-0.5)return['VENDIDO MAIOR — conferir bags não lançados','at'];if(p<0.5)return['EQUILIBRADO','ok'];if(p<=3)return['QUEBRA NORMAL','ok'];if(p<=6)return['QUEBRA ELEVADA — atenção','at'];return['QUEBRA CRÍTICA — investigar','ruim']}
function apurar(did){
  const d=despPorId(did),vs=db.vendas.filter(v=>v.despescaId===did),bags=db.bags.filter(b=>b.despescaId===did),doa=db.doacoes.filter(x=>x.despescaId===did),cus=db.custos.filter(x=>x.despescaId===did);
  const kg=r3(vs.reduce((s,v)=>s+pesoVenda(v),0)),fat=r2(vs.reduce((s,v)=>s+valorVenda(v),0)),pm=kg?r2(fat/kg):0;
  const prod=resumoBags(bags),doado=r3(doa.reduce((s,x)=>s+Number(x.peso||0),0)),dif=r3(prod.kg-kg-doado),base=prod.kg||kg;
  const custo=r2(cus.reduce((s,x)=>s+Number(x.valor||0),0)),baseC=Number(d&&d.pesoCusto)||kg||prod.kg,margem=r2(fat-custo);
  let aberto=0;const tits={};vs.forEach(v=>{if(!tits[v.clienteId])tits[v.clienteId]=titulos(v.clienteId);const t=tits[v.clienteId].find(x=>x.ref===v.id);if(t)aberto=r2(aberto+t.aberto)});
  return{d,vs,bags,doa,cus,kg,fat,pm,prod,doado,dif,pct:base?r2(dif/base*100):0,valDif:r2(dif*pm),quebra:classificarQuebra(dif,base),custo,custoKg:baseC?r2(custo/baseC):0,margem,margemKg:baseC?r2(margem/baseC):0,aberto,recebido:r2(fat-aberto),
    porClasse:agrupaItens(vs,(v,i)=>i.produto+' — '+i.classe),porCli:agrupaItens(vs,v=>v.cliente),
    porTanque:Object.values(bags.reduce((o,b)=>{const k=b.tanque+' · '+b.produto;(o[k]=o[k]||{k,l:[]}).l.push(b);return o},{})).map(g=>({k:g.k,...resumoBags(g.l)})).sort((a,b)=>b.kg-a.kg),
    porCat:Object.values(cus.reduce((o,c)=>{(o[c.categoria]=o[c.categoria]||{k:c.categoria,v:0}).v=r2(o[c.categoria].v+Number(c.valor||0));return o},{})).sort((a,b)=>b.v-a.v)};
}

function acerto(){
  const dV=x=>!ga.vend||x===ga.vend,ant=k=>ga.de&&k<ga.de,per=k=>noPer(ga,k);
  const soma=(l,f)=>r2(l.filter(f).reduce((s,x)=>s+Number(x.valor||0),0));
  const rec=db.receb.filter(r=>dV(r.vendedor)),rep=db.repasses.filter(r=>dV(r.vendedor)),mao=db.custos.filter(c=>c.pago==='emmaos'&&dV(c.quem));
  const residual=ga.de?r2(soma(rec,r=>ant(r.data))-soma(rep,r=>ant(r.data))-soma(mao,c=>ant(c.data))):0;
  const recebido=soma(rec,r=>per(r.data)),repassado=soma(rep,r=>per(r.data)),emMaosDesp=soma(mao,c=>per(c.data));
  const vendas=r2(db.vendas.filter(v=>dV(v.vendedor)&&per(v.data)).reduce((s,v)=>s+valorVenda(v),0));
  const desc=soma(db.ajustes.filter(a=>a.tipo==='C'),a=>per(a.data));
  let aRec=0,venc=0;cad.clientes.forEach(c=>{const p=posicao(c.id);aRec=r2(aRec+p.aberto);venc=r2(venc+p.vencido)});
  return{residual,recebido,repassado,emMaosDesp,emMaos:r2(residual+recebido-repassado-emMaosDesp),vendas,desc,aRec,venc,
    lRep:rep.filter(r=>per(r.data)).sort((a,b)=>b.data.localeCompare(a.data)),lRec:rec.filter(r=>per(r.data)).sort((a,b)=>b.data.localeCompare(a.data)),lMao:mao.filter(c=>per(c.data))}
}

    <button class="verde" data-a="gravar">✔ GRAVAR DOAÇÃO</button></section>
   <section class="panel"><h2>Doações da despesca</h2><div class="stat"><div><small>Doações</small><b class="num">${l.length}</b></div><div><small>Kg doados</small><b class="num">${fmtKg(kg)}</b></div></div>
    ${l.map(x=>`<button class="reg" data-a="ed" data-v="${x.id}"><div><span class="eqn">${esc(x.destinatario)}</span><div class="faz">${fmtData(x.data)} · ${esc(x.produto)}${x.fin?' · '+esc(x.fin):''}</div></div><div class="lt">${fmtKg(x.peso)}<small>kg</small></div></button>`).join('')||'<div class="vazio">Nenhuma doação.</div>'}</section>`;
};
CAMPOS.gdoa=(f,el,ev)=>{if(f==='desp'){gd.desp=el.value;render();return}if(f==='data'){if(ev==='change'&&el.value){gd.f.data=el.value;render()}return}gd.f[f]=el.value};
ACOES.gdoa={pr(v){gd.f.produtoId=v;render()},
  gravar(){const F=gd.f,kg=numBR(F.peso);if(!F.dest.trim()){toast('Informe o destinatário');return}if(!(kg>0)){toast('Informe o peso');return}
    if(despFechada(F.data)){toast('Despesca encerrada');return}const d=despescaDaData(F.data,true),p=prodPorId(F.produtoId)||{};gd.desp=d.id;
    const cli=cad.clientes.find(c=>semAcento(c.nome)===semAcento(F.dest.trim()));
    salvarReg('doacoes',{id:'do-'+uid(),despescaId:d.id,data:F.data,destinatario:F.dest.trim().toUpperCase(),clienteId:cli?cli.id:'',produtoId:p.id||'',produto:p.nome||'',peso:r3(kg),qtd:parseInt(F.qtd)||0,finalidade:F.fin.trim(),obs:F.obs.trim()},true);
    gd.f={...doaNovo(),data:F.data};render();toast('Doação gravada')},
  ed(id){const x=db.doacoes.find(z=>z.id===id);if(!x)return;if(despFechada(x.data)){toast('Despesca encerrada');return}
    janela(`<h3>🎁 ${esc(x.destinatario)}</h3><div class="datas"><div><label>Peso (kg)</label><input type="text" id="jP" inputmode="decimal" value="${txtBR(x.peso,3)}"></div><div><label>Peixes</label><input type="number" id="jQ" value="${x.qtd||''}"></div></div>
      <div class="row"><button class="danger" id="jX">🗑 Excluir</button><button class="primary" id="jO">Salvar</button></div>`,(j,fechar)=>{
      j.querySelector('#jX').onclick=()=>{fechar();confirmarExcluir('Excluir esta doação?',()=>{apagarReg('doacoes',x.id);render()})};
      j.querySelector('#jO').onclick=()=>{const kg=numBR(j.querySelector('#jP').value);if(!(kg>0)){toast('Peso inválido');return}salvarReg('doacoes',{...x,peso:r3(kg),qtd:parseInt(j.querySelector('#jQ').value)||0},false);fechar();render()}})}};

/* =====================================================================
   PEIXES, CLASSIFICAÇÕES, TANQUES E CATEGORIAS DE CUSTO
   ===================================================================== */
const linhaCad=(o,tipo,extra='')=>`<div class="eqLinha ${o.inativo?'inativo':''}"><span>${esc(o.nome)}${extra}</span>${o.inativo?`<button class="mini" data-a="reat" data-v="${tipo}:${o.id}">Reativar</button>`:`<button class="mini" data-a="ren" data-v="${tipo}:${o.id}">✏️</button><button class="mini inativar" data-a="inat" data-v="${tipo}:${o.id}">Inativar</button>`}</div>`;
RENDER.gpeix=()=>{
  let h=`<section class="panel"><h2>Peixes e classificações</h2><p class="note">O preço de referência é sugerido na venda quando o cliente não tem preço negociado.</p>`;
  cad.produtos.forEach(p=>{h+=`<div class="fzBloco"><div class="fzCab"><b>${esc(p.nome)}${p.inativo?' (inativo)':''}</b><span><button class="az" data-a="ren" data-v="produtos:${p.id}">✏️</button> ${p.inativo?`<button class="az" data-a="reat" data-v="produtos:${p.id}">Reativar</button>`:`<button class="az" data-a="inat" data-v="produtos:${p.id}">Inativar</button>`}</span></div>
    ${cad.classes.filter(c=>c.produtoId===p.id).map(c=>linhaCad(c,'classes',` <small style="color:var(--muted);font-weight:500">· ref. ${fmtR(c.preco||0)}/kg</small>`)).join('')}
    <div class="addLinha"><input type="text" placeholder="Nova classificação" id="nc-${p.id}"><button class="lima mini" data-a="addCl" data-v="${p.id}">+</button></div></div>`});
  h+=`<div class="row"><input type="text" id="novoPeixe" placeholder="Novo peixe (ex.: PIRARUCU)"><button class="lima" data-a="addPeixe" style="flex:0 0 auto">+ Peixe</button></div></section>`;
  h+=`<section class="panel"><h2>Tanques / viveiros</h2><div class="fzBloco">${cad.tanques.map(t=>linhaCad(t,'tanques')).join('')||'<div class="eqLinha"><span class="note">Nenhum tanque.</span></div>'}<div class="addLinha"><input type="text" id="novoTq" placeholder="Novo tanque"><button class="lima mini" data-a="addTq">+</button></div></div></section>`;
  h+=`<section class="panel"><h2>Categorias de custo</h2><div class="fzBloco">${cad.categorias.map(t=>linhaCad(t,'categorias')).join('')}<div class="addLinha"><input type="text" id="novaCat" placeholder="Nova categoria"><button class="lima mini" data-a="addCat">+</button></div></div></section>`;
  $('t-gpeix').innerHTML=h;
};
const addSimples=(lista,inp,pref,up)=>{const i=$(inp);let n=i.value.trim();if(up)n=n.toUpperCase();if(!n){toast('Digite o nome');return}if(cad[lista].some(x=>!x.inativo&&semAcento(x.nome)===semAcento(n))){toast('Já existe');return}cad[lista].push(toque({id:pref+uid(),nome:n}));salvarCad('Cadastrado');render()};
ACOES.gpeix={
  addPeixe(){addSimples('produtos','novoPeixe','p-',true)},addTq(){addSimples('tanques','novoTq','tq-',true)},addCat(){addSimples('categorias','novaCat','cat-',false)},
  addCl(pid){const i=$('nc-'+pid),n=i.value.trim();if(!n){toast('Digite a classificação');return}cad.classes.push(toque({id:'c-'+uid(),produtoId:pid,nome:n,preco:0}));salvarCad('Classificação criada');render()},
  ren(v){const[l,id]=v.split(':'),o=porId(cad[l],id);
    if(l==='classes'){janela(`<h3>✏️ Classificação</h3><div><label>Nome</label><input type="text" id="jN" value="${esc(o.nome)}"></div><div><label>Preço de referência (R$/kg)</label><input type="text" id="jP" inputmode="decimal" value="${txtBR(o.preco)}"></div><div class="row"><button id="jC">Cancelar</button><button class="primary" id="jO">Salvar</button></div>`,(j,fechar)=>{j.querySelector('#jC').onclick=fechar;j.querySelector('#jO').onclick=()=>{const n=j.querySelector('#jN').value.trim();if(!n)return;o.nome=n;o.preco=numBR(j.querySelector('#jP').value)||0;toque(o);salvarCad('Salvo');fechar();render()}});return}
    campoTexto('Renomear',o.nome,n=>{o.nome=l==='categorias'?n:n.toUpperCase();toque(o);salvarCad('Salvo');render()})},
  inat(v){const[l,id]=v.split(':'),o=porId(cad[l],id);perguntar(`Inativar ${o.nome}?`,'Inativar','var(--warn)',()=>{o.inativo=true;toque(o);salvarCad('Inativado');render()},'Some das listas de lançamento; o histórico continua.')},
  reat(v){const[l,id]=v.split(':'),o=porId(cad[l],id);o.inativo=false;toque(o);salvarCad('Reativado');render()}};

/* =====================================================================
   CONFIGURAÇÕES
   ===================================================================== */
RENDER.gconf=()=>{const P=cad.params;
  $('t-gconf').innerHTML=`<section class="panel"><h2>Parâmetros de venda e cobrança</h2>
    <div class="datas"><div><label>Prazo padrão (dias)</label><input type="number" id="pPrazo" value="${P.prazo}"></div><div><label>Carência antes do atraso (dias)</label><input type="number" id="pTol" value="${P.tolerancia}"></div></div>
    <label class="opcao"><input type="checkbox" id="pAlerta" ${P.alerta?'checked':''}> Alertar ao vender para cliente com título vencido</label>
    <label class="opcao"><input type="checkbox" id="pBloq" ${P.bloquear?'checked':''}> Bloquear a venda (só libera com a senha)</label>
    <div><label>Empresa (nas notas)</label><input type="text" id="pEmp" value="${esc(P.empresa)}"></div><div><label>Unidade</label><input type="text" id="pUni" value="${esc(P.unidade)}"></div>
    <div><label>Contato no rodapé (telefone, PIX)</label><input type="text" id="pCont" value="${esc(P.contato||'')}"></div>
    <button class="primary" data-a="salvarP">Salvar parâmetros</button></section>
   <section class="panel"><h2>Vendedores / quem lança</h2><div class="fzBloco">${cad.vendedores.map(v=>linhaCad(v,'vendedores')).join('')||'<div class="eqLinha"><span class="note">Ninguém ainda.</span></div>'}<div class="addLinha"><input type="text" id="novoVend" placeholder="Nome"><button class="lima mini" data-a="addVend">+</button></div></div></section>
   <section class="panel"><h2>Despescas</h2><p class="note">Criadas sozinhas por semana (segunda a domingo). Encerre/reabra no Fechamento.</p>${despescasOrd().map(d=>`<div class="eqLinha"><span>${esc(d.descricao)}</span>${d.encerrada?'<span class="estado fechada">encerrada</span>':'<span class="estado aberta">aberta</span>'}<button class="mini" data-a="renD" data-v="${d.id}">✏️</button></div>`).join('')||'<div class="vazio">Nenhuma ainda.</div>'}</section>
   <section class="panel"><h2>Cópia de segurança</h2><p class="note">Tudo fica salvo no aparelho e na planilha do Google. Aqui você baixa uma planilha Excel com todos os lançamentos.</p><button class="verde" data-a="tudo">📊 Exportar tudo (Excel)</button>
    <p class="note">Neste aparelho: ${db.vendas.length} vendas · ${db.receb.length} recebimentos · ${db.bags.length} bags · ${ativos(cad.clientes).length} clientes · ${fila.length} aguardando envio.</p></section>
   <details class="panel avancado"><summary><h2>Avançado · conexão com a nuvem</h2></summary><p class="note">Link do Google Script (termina em /exec) onde ficam salvos todos os lançamentos.</p>
    <input type="text" id="apiUrl" inputmode="url" autocomplete="off" value="${esc(ler(K.api,'')||API_PADRAO)}" placeholder="https://script.google.com/macros/s/…/exec"><button data-a="salvarApi">Salvar link</button>
    <p class="note">Versão do app: v${VERSAO} · aparelho ${esc(disp)}</p></details>`;
};
ACOES.gconf={
  salvarP(){const P=cad.params;P.prazo=Math.max(0,parseInt($('pPrazo').value)||0);P.tolerancia=Math.max(0,parseInt($('pTol').value)||0);P.alerta=$('pAlerta').checked;P.bloquear=$('pBloq').checked;
    P.empresa=$('pEmp').value.trim()||'FJK AGROPECUÁRIA';P.unidade=$('pUni').value.trim()||'Piscicultura';P.contato=$('pCont').value.trim();P.alt=agora();salvarCad('Parâmetros salvos')},
  addVend(){addSimples('vendedores','novoVend','v-',false)},
  ren(v){ACOES.gpeix.ren(v)},inat(v){ACOES.gpeix.inat(v)},reat(v){ACOES.gpeix.reat(v)},
  renD(id){const d=despPorId(id);campoTexto('Nome da despesca',d.descricao,n=>{d.descricao=n;toque(d);salvarCad('Salvo');render()})},
  tudo(){compartilharArquivo(xlsxTudo(),`Piscicultura FJK - tudo ${fmtData(chaveDia()).replace(/\//g,'-')}.xlsx`,XT)},
  salvarApi(){const v=$('apiUrl').value.trim();if(v&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){toast('O link precisa começar com https://script.google.com e terminar em /exec');return}gravar(K.api,v);toast('Link salvo');carregar()}};

/* =====================================================================
   INÍCIO / ATUALIZAÇÃO
   ===================================================================== */
function marcaAtualizado(d){if(d)gravar(K.sync,d);const x=ler(K.sync,null);
  $('hoje').textContent=x?`Atualizado ${fmtDM(chaveDia(new Date(x)))} às ${fmtHora(x)} – v${VERSAO}`:`v${VERSAO}`}
$('btnAtualizar').onclick=()=>{checarVersao(true);carregar()};
async function checarVersao(forcar){
  try{
    const v=String((await (await fetch('versao.json?t='+Date.now(),{cache:'no-store'})).json()).versao||'');
    if(!v||v===VERSAO)return;
    let tentou='';try{tentou=sessionStorage.getItem('pc_tentou')||''}catch(e){}
    if(tentou===v&&!forcar)return;
    try{sessionStorage.setItem('pc_tentou',v)}catch(e){}
    if(FORMS.includes(tela)||!$('tecSenha').hidden||document.querySelector('.fundo'))return; // não atrapalha quem está lançando
    try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(e){}
    toast('Atualizando o app…');setTimeout(()=>location.reload(),600);
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checarVersao();carregar()}});
window.addEventListener('pageshow',()=>checarVersao());
window.addEventListener('online',carregar);
setInterval(()=>{if(document.visibilityState==='visible')carregar()},60000);
marcaAtualizado();marcaQuem();statusNuvem();carregar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
