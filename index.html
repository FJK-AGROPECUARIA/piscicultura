<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d47a1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Piscicultura - FJK</title>
<style>
:root{
  --bg:#f4f7f9; --surface:#ffffff; --line:#dde3ea; --fg:#11253d; --muted:#5d6b7a;
  --accent:#0d47a1; --accent-fg:#ffffff; --lima:#1976d2; --lima-claro:#e3eefb;
  --verde:#1f8f4e; --ok:#3f7d1a; --warn:#b26a00; --bad:#b3261e; --chip:#e3eefb;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.topo{background:linear-gradient(135deg,#0b3a82 0%,#1e88e5 100%);color:#fff;padding:14px max(12px,env(safe-area-inset-right,0px)) 14px max(12px,env(safe-area-inset-left,0px));border-radius:0 0 20px 20px}
.topoLinha{display:flex;align-items:center;gap:8px;min-height:66px}
body.naInicio .topoLinha{min-height:clamp(80px,24vw,130px)}
.topo img.topoLogo{height:clamp(52px,15.5vw,80px);width:auto;flex:none;display:block;margin:0}
body.naInicio .topo img.topoLogo{height:clamp(56px,16vw,96px)}
.topoTxt{flex:1;min-width:0;position:relative;padding-left:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;align-self:stretch}
.topoTxt::before{content:'';position:absolute;left:0;top:16%;bottom:16%;width:2px;border-radius:2px;background:#a9c41c;opacity:.85}
.topoTxt h1{color:#fff;margin:0;font-family:var(--body);font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;font-size:clamp(14px,4.4vw,22px);max-width:100%}
body.naInicio .topoTxt h1{font-size:clamp(16px,4.8vw,26px)}
.topoTxt .sub{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 6px;font-size:12.5px;margin-top:3px;color:#e7f5c2}
.topoTxt #hoje{white-space:nowrap;overflow:hidden;max-width:100%;font-size:clamp(9.5px,2.9vw,12.5px)}
body:not(.naInicio) .topo img.topoLogo{height:clamp(42px,12vw,70px)}
.stat{flex-wrap:nowrap!important}.stat div{flex:1 1 0!important;min-width:0}.stat small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.66rem!important}
.topo #nuvem{background:#fff;padding:0 6px;border-radius:99px;white-space:nowrap;font-size:9.5px;line-height:1.6;font-weight:700}
.sub{font-size:13px}
.nuvem{font-weight:600}
.voltarIni,.atualizarBtn{flex:none;border:0;background:none;line-height:1;padding:6px 4px;color:#fff;cursor:pointer}
.voltarIni{font-size:1.6rem}.atualizarBtn{font-size:1.6rem}
.atualizarBtn.girando{animation:girar .8s linear infinite}
@keyframes girar{from{transform:rotate(0)}to{transform:rotate(360deg)}}
body.naInicio .voltarIni{display:none}
h2{font-family:var(--display);font-stretch:condensed;font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel>h2:first-child,.panel>.curhead:first-child h2{border-left:5px solid var(--lima);padding-left:8px}
.curhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label{font-size:.85rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
input[type=number],input[type=text],input[type=password],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
select{font-weight:600}
textarea{min-height:70px;resize:vertical}
input.big{font-family:var(--display);font-stretch:condensed;font-size:2.2rem;font-weight:700;padding:8px 12px;text-align:center}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{font:inherit;font-weight:600;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:1.15rem;padding:14px}
button.verde{background:var(--verde);border-color:var(--verde);color:#fff;font-size:1.2rem;padding:16px}
button.lima{background:var(--lima);border-color:var(--lima);color:#fff}
button.danger{border-color:var(--bad);color:var(--bad)}
button.mini{padding:5px 10px;font-size:.92rem}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.note{font-size:.85rem;color:var(--muted);margin:0}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;max-width:90vw;text-align:center;z-index:20}
/* Início */
.inicio{display:none;flex-direction:column;gap:14px;padding-top:10px}
body.naInicio .inicio{display:flex}
button.grande{font-size:1.9rem;padding:24px 14px;border-radius:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;border:0}
button.gAbast{background:#3d9ad6;border-color:#3d9ad6;color:#fff}
button.gHist{background:#3d84c6;border-color:#3d84c6;color:#fff}
button.gCad{background:#11253d;border-color:#11253d;color:#fff}
button.gEnt{background:#5f6b73;border-color:#5f6b73;color:#fff}
button.gEst{background:#2c4f7c;border-color:#2c4f7c;color:#fff}
/* Escolha (fazendas / equipamentos) */
.escolha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.escolha button{padding:12px 4px;font-family:var(--display);font-stretch:condensed;font-size:1.15rem;line-height:1.1;min-height:58px}
.escolha button small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:500;margin-top:3px}
.escolha button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.escolha button.sel small{color:#c9d3df}
.escolha.eq button.sel{background:var(--lima);border-color:var(--lima);color:#fff}
.escolha.eq button.sel small{color:var(--fg)}
.vazio{background:var(--chip);border-radius:10px;padding:12px;font-size:.9rem;color:var(--muted);text-align:center}
.dataLinha{display:flex;align-items:center;gap:10px}
.dataLinha input{flex:1}
.dataLinha.outra input{border-color:var(--warn);background:#fff4e0;color:var(--warn);font-weight:700}
.passo{display:flex;flex-direction:column;gap:8px}
.resumoSel{background:var(--chip);border-radius:10px;padding:10px 12px;font-weight:600}
/* Pendentes (10 min, só neste aparelho) */
.pend{border:2px dashed var(--warn);background:#fffaf0}
.pendItem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pendTopo{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pendTopo b{font-family:var(--display);font-stretch:condensed;font-size:1.25rem}
.pendTopo .litros{font-family:var(--display);font-stretch:condensed;font-size:1.5rem;font-weight:700;white-space:nowrap}
details.pend summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.pend summary::-webkit-details-marker{display:none}
details.pend summary h2{border-left:5px solid var(--lima);padding-left:8px}
details.pend .seta{font-size:1.4rem;color:var(--muted);transition:transform .2s}
details.pend:not([open]) .seta{transform:rotate(-90deg)}
details.pend[open]{gap:14px}
details.pend:not([open]){gap:0}
.relogio{font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums}
/* Histórico */
.periodo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.estMini{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.estMini button{background:var(--chip);border:2px solid var(--lima);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:0;color:var(--fg)}
.estMini button.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:#cfe0f7}
.estMini small{font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.estMini b{font-family:var(--display);font-stretch:condensed;font-size:clamp(1.05rem,5.6vw,1.5rem);color:var(--ok);line-height:1.1;white-space:nowrap}.estMini b.neg{color:var(--bad)}
.tipoMov{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.tipoMov button{border:0;border-radius:12px;padding:13px 4px;font-weight:700;font-size:1rem;background:transparent;color:var(--fg)}
.tipoMov button.sel{background:var(--accent);color:#fff}
.reg .lt.mais{color:var(--verde)}
#tHist .stat b{white-space:nowrap;font-size:clamp(1.05rem,5.2vw,1.6rem)}
.periodo button{padding:8px 4px;font-size:.9rem;border-radius:99px}
.periodo button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.datas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.datas input{min-width:0;padding:10px 8px}
.datas>div{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:46px;text-align:center}
input[type=date]::-webkit-date-and-time-value{text-align:center;margin:0}
.datas input[type=date]{font-size:15px;padding:10px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;font-size:.92rem;border-radius:99px}
.chips button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{flex:1 1 90px;background:var(--chip);border-radius:10px;padding:8px 12px}
.stat small{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat b{font-family:var(--display);font-stretch:condensed;font-size:1.6rem}
.dia{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 2px 4px}
.reg{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-radius:0;border-left:0;border-right:0;border-top:0;text-align:left;font-weight:400}
.reg .eqn{font-family:var(--display);font-stretch:condensed;font-size:1.2rem;font-weight:700}
.reg .faz{font-size:.82rem;color:var(--muted)}
.reg .obs{font-size:.82rem;color:var(--fg);font-style:italic;margin-top:2px}
.reg .lt{font-family:var(--display);font-stretch:condensed;font-size:1.4rem;font-weight:700;white-space:nowrap;text-align:right}
.reg .lt small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;background:#fff4e0;color:var(--warn);margin-left:4px;vertical-align:middle}
.pdfChip{background:var(--chip);border-radius:8px;padding:8px 10px;font-weight:600;font-size:.9rem}
.compart{display:flex;gap:8px}.compart>button{flex:1 1 0;padding:12px 6px;font-size:1.02rem}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fotoSlot{position:relative;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;color:var(--muted);cursor:pointer;overflow:hidden}
.fotoSlot span{font-size:1.8rem}
.fotoSlot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fotoSlot img{width:100%;height:100%;object-fit:cover}
.fotoSlot .tirar{position:absolute;top:6px;right:6px;width:34px;height:34px;padding:0;border-radius:50%;border:0;background:rgba(17,37,61,.8);color:#fff;font-size:1rem}
.minis{display:flex;gap:6px}.minis img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.galeria{display:flex;flex-direction:column;gap:10px}.galeria img{width:100%;border-radius:10px;border:1px solid var(--line)}
.galeria .carregando{background:var(--chip);border-radius:10px;padding:30px;text-align:center;color:var(--muted)}
.det{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}.det dt{color:var(--muted);font-weight:600}.det dd{margin:0;font-weight:600}
.opcao{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--fg);margin:0;cursor:pointer}
.opcao input{width:22px;height:22px;accent-color:var(--accent)}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:600;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:12px 10px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--fg);margin:0}
.filebtn.lima{background:var(--lima);border-color:var(--lima);color:#fff}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.leitura{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.92rem}
.leitura.ok{background:#e6f4ea;color:#1f6b3a}.leitura.aviso{background:#fff4e0;color:var(--warn)}
.obrig{color:var(--bad)}
.estCard{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;font-weight:400}
.estCard.sel{border-color:var(--accent);border-width:3px}
.estTopo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.estTopo b{font-family:var(--display);font-stretch:condensed;font-size:1.35rem}
.saldo{font-family:var(--display);font-stretch:condensed;font-size:2rem;font-weight:700;color:var(--ok)}.saldo.neg{color:var(--bad)}
.estLinha{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}.estLinha b{color:var(--fg)}
.lt.ok{color:var(--verde)}
/* Teclado de senha (igual ao Gestão de Tratos) */
.senhaFundo{position:fixed;inset:0;z-index:30;background:rgba(17,37,61,.6)}
.teclado{position:fixed;bottom:0;z-index:31;left:50%;transform:translateX(-50%);max-width:100%;background:var(--bg);border-top:3px solid var(--lima);border-radius:16px 16px 0 0;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.15)}
.tecTopo{display:flex;justify-content:space-between;align-items:baseline;width:276px;max-width:100%;margin:0 auto;padding:2px 2px 6px;font-family:var(--display);font-stretch:condensed;font-size:1.05rem;font-weight:600}
.tecTopo b{font-size:1.5rem;letter-spacing:.15em}
.tecGrade{display:grid;grid-template-columns:repeat(3,88px);justify-content:center;gap:6px}
.teclado button{height:60px;padding:0;font-size:26px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 1px 0 var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.teclado button.tecSec{background:#eef1f4;font-size:1rem}
.teclado button:active{background:var(--lima-claro)}
.tecAcoes1{display:grid;width:276px;max-width:100%;margin:6px auto 0}
.tecAcoes1 button.tecOk{background:#1f8f4e;border-color:#1f8f4e;color:#fff;font-size:1.3rem;height:52px}
button.camBtn{font-size:1.2rem;padding:16px}
.enCampos{display:flex;flex-direction:column;gap:14px}
.subTit{padding:8px 12px 4px;border-top:2px solid var(--line);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fafbf8}
.escolha.op button.sel{background:var(--lima);border-color:var(--lima);color:#fff}
.camLinha{display:flex;gap:8px;align-items:stretch}.camLinha .camBtn{flex:1;min-width:0}
.galBtn{position:relative;flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin:0;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:1.4rem;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--fg)}
.galBtn span{font-size:.72rem;font-weight:700}.galBtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#abFotos label.fotoSlot{display:none}
.dataBox{position:relative;display:block;flex:1;min-width:0}
.dataBox input[type=date]{position:absolute!important;inset:0;width:100%!important;height:100%!important;opacity:0;margin:0;cursor:pointer;z-index:1}
.dataTxt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 8px;font-weight:600}
.dataTxt::after{content:'📅';font-size:.95rem}
.dataTxt.vazio{color:var(--muted);font-weight:400}
.dataLinha.outra .dataTxt{border-color:var(--warn);background:#fff4e0;color:var(--warn)}
 #abFotos{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#abFotos .fotoSlot{aspect-ratio:1;border-radius:10px}
#abFotos label.fotoSlot{font-size:.62rem;gap:0;line-height:1.1;text-align:center}#abFotos label.fotoSlot span{font-size:1.2rem}
#abFotos .fotoSlot .tirar{width:24px;height:24px;font-size:.7rem;top:3px;right:3px}
.estAtual{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--chip);border:2px solid var(--lima);border-radius:12px;padding:10px 14px}
.estAtual small{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.estAtual b{white-space:nowrap;flex:none;font-family:var(--display);font-stretch:condensed;font-size:2rem;line-height:1;color:var(--ok)}.estAtual b.neg{color:var(--bad)}
.gTiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:10px}
.gTiles button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px;padding:14px 8px;border-radius:18px;border:0;background:var(--c);color:#fff;font-size:1.3rem;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.gTiles .gIc{font-size:2.6rem;line-height:1}
.gTiles button:last-child:nth-child(odd){grid-column:1/-1}
.eqTopo{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}.eqTopo label{margin:0}.eqTopo button{font-size:.8rem;padding:4px 8px}
.eqMarcar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.eqChk{display:flex;align-items:center;gap:8px;margin:0;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--muted);cursor:pointer;min-width:0}
.eqChk.on{border-color:var(--accent);background:var(--chip);color:var(--fg);font-weight:700}
.eqChk input{width:20px;height:20px;flex:none;accent-color:var(--accent);margin:0}
.eqChk span{min-width:0;overflow:hidden;text-overflow:ellipsis}.eqChk small{display:block;font-size:.72rem;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{white-space:normal!important;overflow:visible!important;font-size:.62rem!important;letter-spacing:.02em!important;line-height:1.2}
button.inativar{border-color:var(--warn);color:var(--warn)}
.eqLinha.inativo{background:#f4f5f6}.eqLinha.inativo>span{color:var(--muted)}

<script>
'use strict';
/* =====================================================================
   FJK PISCICULTURA — vendas, conta corrente, despesca, custos e acerto
   Mesma base dos apps Gestão de Tratos / Abastecimentos:
   funciona sem internet (guarda no aparelho) e envia para a nuvem
   (Google Script) assim que o sinal volta.
   ===================================================================== */
const PRAZO=5*60*1000; // quem lançou pode editar/excluir por 5 minutos sem senha
const API_PADRAO='https://script.google.com/macros/s/AKfycbwcOrQCcLUC2FmLZPAGfmJNChxdtbh80tajcaMXLvrJaAqedwJXFuZCsDIaxQl2E67gIw/exec'; // link do Google Script (/exec) — colar aqui depois de publicar o Code.gs
const VERSAO='22';
const K={cad:'pc_cad',db:'pc_db',fila:'pc_fila',pend:'pc_pend',api:'pc_api',disp:'pc_disp',quem:'pc_quem',rascV:'pc_rascV',sync:'pc_sync',gest:'pc_gestOk'};
const TABS=['vendas','receb','ajustes','bags','doacoes','custos','repasses'];
const CATS=['Ração','Oxigênio / Aeração','Combustível / Transporte','Gelo','Mão de obra (fixa)','Mão de obra (diárias)','Insumos veterinários','Energia elétrica','Manutenção / Equipamentos','Alimentação','Hospedagem','Despesas administrativas','Investimentos','Outros'];
const CONDICOES=['A PRAZO','PIX','DINHEIRO','CHEQUE'];
const FORMAS=['PIX','DINHEIRO','CHEQUE'];
const FAIXAS=[[1,15,'01 a 15 dias'],[16,30,'16 a 30 dias'],[31,60,'31 a 60 dias'],[61,90,'61 a 90 dias'],[91,1e9,'acima de 90 dias']];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEMANA=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ler(k,p){try{const v=JSON.parse(localStorage.getItem(k));return v??p}catch(e){return p}}
function gravar(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Memória do aparelho cheia')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const agora=()=>new Date().toISOString();
function chaveDia(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dDe(k){const[y,m,d]=String(k).split('-').map(Number);return new Date(y,m-1,d)}
function fmtData(k){if(!k)return'';const[y,m,d]=String(k).slice(0,10).split('-');return d+'/'+m+'/'+y}
function fmtDM(k){if(!k)return'';const[,m,d]=String(k).split('-');return d+'/'+m}
function fmtHora(iso){const d=new Date(iso);return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtDH(iso){const d=new Date(iso);return isNaN(d)?'':fmtData(chaveDia(d))+' '+fmtHora(iso)}
function somaDias(k,n){const d=dDe(k);d.setDate(d.getDate()+Number(n||0));return chaveDia(d)}
function difDias(a,b){return Math.round((dDe(b)-dDe(a))/86400000)} // b - a
function nomeDia(k){return SEMANA[dDe(k).getDay()]}
const r2=n=>Math.round((Number(n)||0)*100+Number.EPSILON*100)/100;
const r3=n=>Math.round((Number(n)||0)*1000)/1000;
const fmtR=n=>(n==null||isNaN(n))?'—':'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN2=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtKg=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
const fmtI=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const fmtP=n=>(isFinite(n)?Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2}):'0')+'%';
const numBR=s=>{s=String(s??'').trim().replace(/[^\d.,-]/g,'');if(!s)return NaN;if(/,/.test(s))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const txtBR=(n,d=2)=>(n==null||isNaN(n)||n==='')?'':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d,useGrouping:false});
const ordTxt=(a,b)=>String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'});
const semAcento=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- Semana da despesca (segunda a domingo; a semana é do mês da segunda) ---------- */
function segundaDe(k){const d=dDe(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return chaveDia(d)}
function semanaDoMes(seg){const d=dDe(seg);const p=new Date(d.getFullYear(),d.getMonth(),1);const desl=(7-((p.getDay()+6)%7))%7;const ps=new Date(p);ps.setDate(1+desl);return Math.max(1,Math.floor((d-ps)/604800000+1e-9)+1)}
function descSemana(k){const s=segundaDe(k),dom=somaDias(s,6),d=dDe(s);const m=MESES[d.getMonth()];return `${m[0].toUpperCase()+m.slice(1)} ${d.getFullYear()} | Semana ${semanaDoMes(s)} (${fmtDM(s)} a ${fmtData(dom)})`}

/* ---------- Estado ---------- */
function cadInicial(){const P1='p-tamba',P2='p-tila';return{inicial:true,
  produtos:[{id:P1,nome:'TAMBATINGA'},{id:P2,nome:'TILÁPIA'}],
  classes:[{id:'c-1',produtoId:P1,nome:'Inteiro — padrão',preco:0},{id:'c-2',produtoId:P1,nome:'Inteiro — acima de 2,0 kg',preco:0},{id:'c-3',produtoId:P1,nome:'Inteiro — 1,0 a 2,0 kg',preco:0},{id:'c-4',produtoId:P1,nome:'Eviscerado',preco:0},{id:'c-5',produtoId:P2,nome:'Inteiro — padrão',preco:0},{id:'c-6',produtoId:P2,nome:'Filé',preco:0}],
  clientes:[],tanques:[],categorias:CATS.map((n,i)=>({id:'cat-'+(i+1),nome:n})),vendedores:[],despescas:[],
  params:{prazo:7,tolerancia:0,alerta:true,bloquear:false,empresa:'FJK AGROPECUÁRIA',unidade:'Piscicultura',contato:'',alt:''}}}
let disp=ler(K.disp,null);if(!disp){disp='pc-'+uid();gravar(K.disp,disp)}
let cad=ler(K.cad,null)||cadInicial();
let db=ler(K.db,{});TABS.forEach(t=>{if(!Array.isArray(db[t]))db[t]=[]});
let fila=ler(K.fila,[]);
let pend=ler(K.pend,[]);
const apiUrl=()=>ler(K.api,'')||API_PADRAO;
function garanteCad(){['produtos','classes','clientes','tanques','categorias','vendedores','despescas'].forEach(k=>{if(!Array.isArray(cad[k]))cad[k]=[]});
  cad.params=Object.assign(cadInicial().params,cad.params||{});}
garanteCad();

const ativos=l=>l.filter(x=>!x.inativo&&!x.excluido);
const naoExcl=l=>l.filter(x=>!x.excluido);
const porId=(l,id)=>l.find(x=>x.id===id);
const prodPorId=id=>porId(cad.produtos,id), classePorId=id=>porId(cad.classes,id), cliPorId=id=>porId(cad.clientes,id), despPorId=id=>porId(cad.despescas,id);
const classesDo=pid=>ativos(cad.classes).filter(c=>c.produtoId===pid);
const nomeCli=c=>c?(c.apelido?`${c.nome} (${c.apelido})`:c.nome):'—';
const quem=()=>ler(K.quem,'');

function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800)}

/* ---------- Gravação (aparelho + fila para a nuvem) ---------- */
function salvarCad(msg){cad.params.alt=cad.params.alt||'';delete cad.inicial;gravar(K.cad,cad);
  fila=fila.filter(f=>f.acao!=='cadastros');fila.push({acao:'cadastros',dados:cad});gravar(K.fila,fila);if(msg)toast(msg);enviarFila()}
const toque=o=>{o.alt=agora();return o};
function salvarReg(tab,rec,novo){
  rec.alteradoEm=agora();if(novo){rec.registradoEm=rec.registradoEm||rec.alteradoEm;rec.disp=disp;rec.lancadoPor=rec.lancadoPor||quem()}
  const i=db[tab].findIndex(x=>x.id===rec.id);if(i>=0)db[tab][i]=rec;else db[tab].push(rec);
  gravar(K.db,db);
  fila.push({acao:'salvar',tab,dados:rec});gravar(K.fila,fila);
  if(novo){pend.push({id:rec.id,tab,em:rec.registradoEm});pend=pend.filter(p=>restante(p)>0);gravar(K.pend,pend)}
  enviarFila();
}
function apagarReg(tab,id){db[tab]=db[tab].filter(x=>x.id!==id);gravar(K.db,db);pend=pend.filter(p=>p.id!==id);gravar(K.pend,pend);
  fila.push({acao:'excluir',tab,id});gravar(K.fila,fila);enviarFila()}
function restante(p){return Math.max(0,PRAZO-(Date.now()-new Date(p.em).getTime()))}
const recentes=tab=>pend.filter(p=>p.tab===tab&&restante(p)>0).map(p=>({p,a:db[tab].find(a=>a.id===p.id)})).filter(x=>x.a);
const ehRecente=id=>pend.some(p=>p.id===id&&restante(p)>0);
function mmss(ms){const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

/* ---------- Despesca da semana ---------- */
function despescaDaData(k,criar){
  const id='sem-'+segundaDe(k);let d=despPorId(id);
  if(!d)d=cad.despescas.find(x=>x.ini<=k&&(x.fim||x.ini)>=k);
  if(!d&&criar){d=toque({id,descricao:descSemana(k),ini:segundaDe(k),fim:somaDias(segundaDe(k),6),encerrada:false});cad.despescas.push(d);salvarCad()}
  return d||null;
}
const despescasOrd=()=>cad.despescas.slice().sort((a,b)=>String(b.ini).localeCompare(String(a.ini)));

/* ---------- Vendas: peso, valor e conta corrente ---------- */
const pesoItem=i=>r3((i.pesadas||[]).reduce((s,p)=>s+Number(p||0),0));
const valorItem=i=>r2(pesoItem(i)*Number(i.preco||0));
const pesoVenda=v=>r3((v.itens||[]).reduce((s,i)=>s+pesoItem(i),0));
const valorVenda=v=>r2((v.itens||[]).reduce((s,i)=>s+valorItem(i),0));
const numVenda=v=>v.num?'Título '+String(v.num).padStart(4,'0'):'Título (aguardando nº)';
const numCurto=v=>v.num?'Nº '+String(v.num).padStart(4,'0'):'s/ nº';
const descItens=v=>(v.itens||[]).map(i=>`${i.produto} — ${fmtKg(pesoItem(i))} kg × ${fmtR(i.preco)}`).join('; ');

function movimentos(cliId){
  const m=[];
  db.vendas.filter(v=>v.clienteId===cliId).forEach(v=>m.push({data:v.data,ordem:1,tipo:'VENDA',ref:v.id,rec:v,hist:numVenda(v)+(v.nf?' (NF '+v.nf+')':'')+' — '+descItens(v),debito:valorVenda(v),credito:0,peso:pesoVenda(v),venc:v.venc||v.data,despescaId:v.despescaId}));
  db.ajustes.filter(a=>a.clienteId===cliId).forEach(a=>m.push({data:a.data,ordem:2,tipo:a.tipo==='D'?'DEBITO':'CREDITO',ref:a.id,rec:a,hist:(a.tipo==='D'?'Débito — ':'Crédito/desconto — ')+(a.desc||''),debito:a.tipo==='D'?Number(a.valor):0,credito:a.tipo==='C'?Number(a.valor):0,peso:0,venc:a.venc||a.data}));
  db.receb.filter(p=>p.clienteId===cliId).forEach(p=>m.push({data:p.data,ordem:3,tipo:'PAGAMENTO',ref:p.id,rec:p,hist:'Recebimento'+(p.forma?' — '+p.forma:'')+(p.doc?' (doc. '+p.doc+')':'')+(p.obs?' — '+p.obs:''),debito:0,credito:Number(p.valor),peso:0,venc:p.data}));
  m.sort((a,b)=>String(a.data).localeCompare(String(b.data))||a.ordem-b.ordem||String(a.rec.registradoEm||'').localeCompare(String(b.rec.registradoEm||'')));
  let s=0;m.forEach(x=>{s=r2(s+x.debito-x.credito);x.saldo=s});return m;
}
function faixaDe(d){for(const[a,b,r]of FAIXAS)if(d>=a&&d<=b)return r;return''}
/* baixa automática FIFO: os créditos quitam os títulos mais antigos primeiro */
function titulos(cliId,ref=chaveDia(),movs){
  movs=movs||movimentos(cliId);const out=[];
  // o que foi pago na própria venda (à vista) quita primeiro aquela venda; o resto segue a ordem FIFO
  const lig={},ids=new Set(movs.filter(m=>m.debito>0).map(m=>m.ref));let cred=0;
  movs.forEach(m=>{if(m.credito<=0)return;const vid=m.rec&&m.rec.vendaId;if(vid&&ids.has(vid))lig[vid]=r2((lig[vid]||0)+m.credito);else cred=r2(cred+m.credito)});
  const ap1={};movs.forEach(m=>{if(m.debito>0&&lig[m.ref]){const a=Math.min(lig[m.ref],m.debito);ap1[m.ref]=a;cred=r2(cred+lig[m.ref]-a)}});
  for(const m of movs){if(m.debito<=0)continue;const resto=r2(m.debito-(ap1[m.ref]||0));const apF=Math.min(cred,resto);cred=r2(cred-apF);const ap=r2((ap1[m.ref]||0)+apF);const ab=r2(m.debito-ap);
    const sit=ab<=0.004?'QUITADA':ap>0?'PARCIAL':'EM ABERTO';const atraso=ab>0.004?Math.max(0,difDias(m.venc,ref)):0;
    out.push({...m,valor:m.debito,pago:r2(ap),aberto:ab,sit,atraso,faixa:ab>0.004&&atraso>0?faixaDe(atraso):''})}
  return out;
}
function posicao(cliId,movs){movs=movs||movimentos(cliId);const t=titulos(cliId,undefined,movs);const tol=Number(cad.params.tolerancia||0);
  const ab=t.filter(x=>x.aberto>0.004);const vencidos=ab.filter(x=>x.atraso>tol);
  return{saldo:movs.length?movs[movs.length-1].saldo:0,aberto:r2(ab.reduce((s,x)=>s+x.aberto,0)),vencido:r2(vencidos.reduce((s,x)=>s+x.aberto,0)),maiorAtraso:vencidos.reduce((m,x)=>Math.max(m,x.atraso),0),titulos:t,abertos:ab,vencidos}}
/* cor financeira: verde quitado · azul a vencer · laranja vence em 3 dias · vermelho vencido · vinho +30 dias */
function sitTag(t){
  if(t.aberto<=0.004)return'<span class="sit quit">Quitada</span>';
  if(t.atraso>30)return`<span class="sit vinho">${t.atraso} dias</span>`;
  if(t.atraso>0)return`<span class="sit venc">Vencida ${t.atraso}d</span>`;
  const f=difDias(chaveDia(),t.venc);if(f<=3)return`<span class="sit vence3">${f<=0?'Vence hoje':'Vence em '+f+'d'}</span>`;
  return`<span class="sit avenc">${t.sit==='PARCIAL'?'Parcial · ':''}A vencer</span>`;
}
function sitVenda(v){const t=titulos(v.clienteId).find(x=>x.ref===v.id);return t?sitTag(t):''}

/* ---------- Senhas (igual ao Gestão de Tratos) ----------
   cada botão da tela inicial tem a sua senha e editar/excluir tem outra.
   Ficam em Gestão › Config. › Senhas (vazia = não pede). */
const SENHAS_PADRAO={desp:'',vendas:'',ver:'',gest:'0000'};
let cadLiberado=false;
const turnoAtual=()=>chaveDia()+(new Date().getHours()<12?'M':'T');
/* senha de cada botão da tela inicial (em branco = abre direto); editar/excluir não pede */
function senhaDe(m){if(!(m in SENHAS_PADRAO))return '';const x=cad&&cad.params&&cad.params.senhas;return x&&typeof x[m]==='string'?x[m]:SENHAS_PADRAO[m]}
const senhaPorTurno=()=>!!(cad&&cad.params&&cad.params.senhaTurno);
function turnoOk(m){try{return senhaPorTurno()&&localStorage.getItem('pc_senhaOk_'+m)===turnoAtual()}catch(e){return false}}
function marcaTurno(m){try{localStorage.setItem('pc_senhaOk_'+m,turnoAtual())}catch(e){}}
let senhaDig='',senhaRes=null,senhaModo='acao';
const senhaAtual=()=>senhaDe(senhaModo);
function mostrarSenha(){$('senhaValor').textContent='●'.repeat(senhaDig.length)+'○'.repeat(Math.max(0,senhaAtual().length-senhaDig.length))}
function verSenha(v){$('tecSenha').hidden=!v;$('senhaFundo').hidden=!v}
function pedirSenhaTec(tit,modo){modo=modo||'acao';return new Promise(r=>{if(!senhaDe(modo)||(modo!=='acao'&&turnoOk(modo))){r(true);return}
  if(senhaRes)senhaRes(false);senhaRes=r;senhaModo=modo;senhaDig='';$('senhaTit').textContent=tit||'Digite a senha';mostrarSenha();verSenha(true)})}
const fimSenha=v=>{const r=senhaRes;senhaRes=null;verSenha(false);senhaDig='';if(v&&senhaModo!=='acao')marcaTurno(senhaModo);if(r)r(v)};
$('senhaFundo').onclick=()=>fimSenha(false);
$('tecSenha').addEventListener('pointerdown',e=>e.preventDefault());
$('tecSenha').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(!b)return;const k=b.dataset.s,sn=senhaAtual();
  if(k==='cancelar'){fimSenha(false);return}
  if(k==='del')senhaDig=senhaDig.slice(0,-1);else if(k!=='ok'&&senhaDig.length<sn.length)senhaDig+=k;
  mostrarSenha();
  if(k==='ok'||senhaDig.length===sn.length){if(senhaDig===sn)fimSenha(true);else{toast('Senha errada');senhaDig='';mostrarSenha()}}});
document.addEventListener('keydown',e=>{if($('tecSenha').hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=/^[0-9]$/.test(e.key)?e.key:e.key==='Backspace'?'del':e.key==='Enter'?'ok':e.key==='Escape'?'cancelar':null;if(!k)return;
  e.preventDefault();const b=$('tecSenha').querySelector(`button[data-s="${k}"]`);if(b)b.click()});
/* senha para editar/excluir (padrão 1010) */
async function comSenha(ok,tit){if(await pedirSenhaTec(tit||'Senha para alterar','acao'))ok()}

/* ---------- Janelas ---------- */
function janela(html,montar,cls){
  const f=document.createElement('div');f.className='fundo';f.innerHTML=`<div class="janela ${cls||''}">${html}</div>`;
  document.body.appendChild(f);const fechar=()=>f.remove();
  f.onclick=e=>{if(e.target===f)fechar()};if(montar)montar(f.firstChild,fechar);return fechar;
}
function perguntar(txt,sim,cor,ok,det){janela(`<h3>${esc(txt)}</h3>${det?`<p class="note">${det}</p>`:''}<div class="row"><button id="jNao">Cancelar</button><button class="primary" id="jSim" style="background:${cor};border-color:${cor}">${sim}</button></div>`,(j,fechar)=>{j.querySelector('#jNao').onclick=fechar;j.querySelector('#jSim').onclick=()=>{fechar();ok()}})}
const confirmarExcluir=(txt,ok)=>perguntar(txt,'Sim, excluir','var(--bad)',ok);
function avisoCancelar(txt,ok){janela(`<h3>⚠️ ${esc(txt)}</h3><p class="note" style="color:var(--bad)">O que foi preenchido será apagado e nada será lançado.</p><div class="row"><button id="jNao">Não, continuar</button><button class="primary" id="jSim" style="background:var(--bad);border-color:var(--bad)">Sim, cancelar</button></div>`,(j,fechar)=>{j.querySelector('#jNao').onclick=fechar;j.querySelector('#jSim').onclick=()=>{fechar();ok()}},'alerta')}
function campoTexto(tit,valor,ok,ph){janela(`<h3>${esc(tit)}</h3><input type="text" id="jT" value="${esc(valor||'')}" placeholder="${esc(ph||'')}"><div class="row"><button id="jC">Cancelar</button><button class="primary" id="jO">Salvar</button></div>`,(j,fechar)=>{const i=j.querySelector('#jT');setTimeout(()=>i.focus(),60);const vai=()=>{const v=i.value.trim();if(!v){toast('Preencha o campo');return}fechar();ok(v)};j.querySelector('#jO').onclick=vai;i.onkeydown=e=>{if(e.key==='Enter')vai()};j.querySelector('#jC').onclick=fechar})}

/* ---------- Quem está lançando (vendedor deste aparelho) ---------- */
function escolherQuem(depois){

/* converte o texto do relatório em célula: R$ e kg viram número; dd/mm/aaaa vira data */
function celula(v,tot){
  if(v==null)return null;if(typeof v==='number')return{v,s:tot?5:3};
  const s=String(v).trim();
  let m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(m)return{v:(Date.UTC(+m[3],+m[2]-1,+m[1])-Date.UTC(1899,11,30))/86400000,s:2};
  if(/^-?(R\$\s?)?-?[\d.]+(,\d+)?(\s?(kg|%))?$/.test(s)&&/\d/.test(s)){const n=numBR(s.replace(/R\$|kg|%/g,''));if(!isNaN(n))return{v:n,s:tot?5:3}}
  return{v:s,s:tot?4:0};
}
function xlsxDeRel(rel){
  const abas=[],usados={},nomeAba=t=>{let n=String(t||rel.xlsNome||'Relatório').replace(/[\\\/?*\[\]:]/g,'-').slice(0,31),k=n,i=2;while(usados[k])k=n.slice(0,28)+' '+(i++);usados[k]=1;return k};
  const res=[];rel.blocos.forEach(b=>{if(b.kv){if(b.tit)res.push([{v:b.tit,s:4}]);b.kv.forEach(r=>res.push([{v:r[0],s:r[3]?4:0},celula(r[1],r[3])]))}if(b.txt)res.push([{v:b.txt}])});
  if(res.length)abas.push([nomeAba('Resumo'),[[{v:'Item',s:1},{v:'Valor',s:1}],...res],[40,22]]);
  const tabs=rel.blocos.filter(b=>b.cols);
  tabs.forEach(b=>{const rows=[b.cols.map(c=>({v:c.t,s:1})),...b.linhas.map(r=>r&&r.sub?[{v:r.sub}]:r.map(v=>celula(v)))];if(b.total)rows.push(b.total.map(v=>celula(v,1)));
    abas.push([nomeAba(tabs.length===1?rel.xlsNome:b.tit),rows,b.cols.map(c=>Math.max(10,Math.min(48,Math.round(c.w*1.1))))])});
  if(!abas.length)abas.push([nomeAba(),[[{v:rel.titulo,s:1}]],[30]]);
  return montarXlsx(abas);
}

/* ---------- Nuvem (Google Script) ---------- */
let enviando=false,online=null;
function statusNuvem(){
  const el=$('nuvem');
  if(!apiUrl()){el.textContent='Nuvem: não ligada';el.style.color='var(--warn)';return}
  if(fila.length){el.textContent=`Nuvem: ${fila.length} aguardando envio`;el.style.color='var(--warn)';return}
  el.textContent=online===false?'sem internet':'Nuvem ok ✓';el.style.color=online===false?'var(--bad)':'var(--ok)';
}
async function enviarFila(){
  if(!apiUrl()||enviando||!fila.length){statusNuvem();return}
  enviando=true;
  try{
    while(fila.length){
      const op=fila[0];
      const r=await fetch(apiUrl(),{method:'POST',body:JSON.stringify({...op,disp})});
      const j=await r.json();if(!j.ok)throw new Error(j.erro||'erro');
      if(op.acao==='salvar'&&op.tab==='vendas'&&j.num){const v=db.vendas.find(x=>x.id===op.dados.id);if(v&&!v.num){v.num=j.num;gravar(K.db,db)}
        fila.forEach(f=>{if(f!==op&&f.acao==='salvar'&&f.dados.id===op.dados.id&&!f.dados.num)f.dados.num=j.num})}
      fila.shift();gravar(K.fila,fila);online=true;
    }
  }catch(e){online=false}
  enviando=false;statusNuvem();
}
function aplicaFila(){
  for(const f of fila){
    if(f.acao==='salvar'){const l=db[f.tab];const i=l.findIndex(x=>x.id===f.dados.id);if(i>=0)l[i]=f.dados;else l.push(f.dados)}
    if(f.acao==='excluir')db[f.tab]=db[f.tab].filter(x=>x.id!==f.id);
    if(f.acao==='cadastros')cad=f.dados;
  }
}
async function carregar(){
  if(!apiUrl()){statusNuvem();return}
  $('btnAtualizar').classList.add('girando');
  try{
    await enviarFila();
    if(fila.length)throw new Error('fila');
    const j=await (await fetch(apiUrl()+'?acao=listar',{cache:'no-store'})).json();
    if(!j.ok)throw new Error(j.erro);
    if(j.cadastros&&j.cadastros.produtos)cad=j.cadastros;
    else if(!fila.some(f=>f.acao==='cadastros'))salvarCad(); // primeira vez: manda os cadastros iniciais
    garanteCad();
    TABS.forEach(t=>db[t]=(j.dados&&j.dados[t])||[]);aplicaFila();
    gravar(K.cad,cad);gravar(K.db,db);online=true;marcaAtualizado(agora());
  }catch(e){online=false}
  $('btnAtualizar').classList.remove('girando');
  if(!document.querySelector('.fundo')&&!ocupado())render();else statusNuvem();
}

    {tit:'Itens',cols:[{t:'Peixe / classificação',w:34},{t:'Pesadas',w:9,al:'r'},{t:'Peso kg',w:12,al:'r'},{t:'R$/kg',w:12,al:'r'},{t:'Valor',w:15,al:'r'}],
      linhas:(v.itens||[]).flatMap(i=>[[`${i.produto} — ${i.classe}`,String((i.pesadas||[]).length),fmtKg(pesoItem(i)),fmtR(i.preco),fmtR(valorItem(i))],{sub:`Pesadas: ${(i.pesadas||[]).map(fmtKg).join(' + ')} = ${fmtKg(pesoItem(i))} kg`}]),
      total:['TOTAL',String((v.itens||[]).reduce((s,i)=>s+(i.pesadas||[]).length,0)),fmtKg(pesoVenda(v)),'',fmtR(valorVenda(v))]},
    {kv:[['Valor desta nota',fmtR(valorVenda(v)),null,true],['Saldo total em aberto do cliente',fmtR(p.aberto),p.vencido>0?'#b3261e':null,true]]},
  ],xlsNome:'Nota',semCab1:true}}

/* =====================================================================
   RECEBER
   ===================================================================== */
let fr=null;
ENTRAR.rec=()=>{fr={data:chaveDia(),cliId:null,valor:'',desc:'',forma:'PIX',doc:'',obs:'',busca:''}};
RENDER.rec=()=>{
  const el=$('t-rec'),c=cliPorId(fr.cliId);let h=quemHtml();
  h+=`<section class="panel"><h2>Data</h2>${dataHtml('data',fr.data,'')}</section><section class="panel">${titNovo('Cliente','cliNovo')}`;
  if(c){const p=posicao(c.id);h+=`<div class="resumoSel" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>👤 ${esc(nomeCli(c))}</span><button class="mini" data-a="cliTroca">Trocar</button></div>
    <div class="stat"><div><small>Em aberto</small><b class="num">${fmtR(p.aberto)}</b></div><div><small>Vencido</small><b class="num ${p.vencido>0?'neg':''}">${fmtR(p.vencido)}</b></div></div>
    ${p.abertos.length?`<div class="tabWrap"><table class="tabela"><tr><th>Título</th><th>Venc.</th><th class="r">Aberto</th><th></th></tr>${p.abertos.map(t=>`<tr${fr.vendaId===t.ref?' style="background:#e3eefb"':''}><td>${t.tipo==='VENDA'?esc(numCurto(t.rec)):'Ajuste'}<br><small>${fmtData(t.data)}</small></td><td>${fmtData(t.venc)}</td><td class="r">${fmtR(t.aberto)}</td><td class="r">${sitTag(t)}${t.tipo==='VENDA'?`<br><button class="mini${fr.vendaId===t.ref?' sel':''}" data-a="tit" data-v="${t.ref}" style="margin-top:4px">${fr.vendaId===t.ref?'✓ Este título':'Pagar este'}</button>`:''}</td></tr>`).join('')}</table></div><p class="note">${fr.vendaId?'O valor vai para o título escolhido (o que sobrar quita os mais antigos).':'Toque em <b>Pagar este</b> para escolher o título. Sem escolher, o recebimento quita os títulos mais antigos primeiro.'}</p>`:'<div class="vazio">Cliente sem débito em aberto.</div>'}`}
  else h+=`<div class="cliBox">${clientesGrade(fr.busca,null,{porSaldo:true})}</div>`;
  h+=`</section>`;
  if(c){const p=posicao(c.id);h+=`<section class="panel"><h2>Valor recebido</h2><input type="text" class="big" data-f="valor" inputmode="decimal" value="${esc(fr.valor)}" placeholder="R$ 0,00">
    <label>Desconto (R$)</label><input type="text" inputmode="decimal" data-f="desc" value="${esc(fr.desc||'')}" placeholder="R$ 0,00">
    <p class="note">O desconto abate do débito do cliente, mas não entra como dinheiro recebido.</p>
    ${p.aberto>0.004?`<button data-a="tudo">Receber o total em aberto (${fmtR(p.aberto)})</button>`:''}
    <label>Forma</label><div class="chips">${FORMAS.map(x=>`<button data-a="forma" data-v="${x}" class="${fr.forma===x?'sel':''}">${x}</button>`).join('')}</div>
    <div class="datas"><div><label>Comprovante / doc.</label><input type="text" data-f="doc" value="${esc(fr.doc)}"></div><div><label>Observação</label><input type="text" data-f="obs" value="${esc(fr.obs)}"></div></div>
    <div class="row"><button class="cancelarBtn" data-a="cancelar">Cancelar</button><button class="verde" data-a="gravar" style="flex:2 1 auto">✔ GRAVAR RECEBIMENTO</button></div></section>`}
  /* editar/excluir: em Vendas › Recebimentos, a qualquer hora */
  el.innerHTML=h;
};
CAMPOS.rec=(f,el,ev)=>{if(f==='busca'){if(ev!=='input')return;fr.busca=el.value;atualizaBusca(el,clientesGrade(fr.busca,null,{porSaldo:true}));return}
  if(f==='data'&&ev==='change'){if(el.value){fr.data=el.value;render()}return}
  if(['valor','desc','doc','obs'].includes(f))fr[f]=el.value};
ACOES.rec={
  cli(id){fr.cliId=id;fr.busca='';render()},cliTroca(){fr.cliId=null;fr.valor='';fr.vendaId=null;render()},
  cliNovo(){formCliente(null,c=>{fr.cliId=c.id;render()})},
  tit(id){if(fr.vendaId===id){fr.vendaId=null;render();return}fr.vendaId=id;const t=posicao(fr.cliId).abertos.find(x=>x.ref===id);if(t)fr.valor=txtBR(Math.max(0,r2(t.aberto-(r2(numBR(fr.desc))||0))));render()},
  tudo(){fr.valor=txtBR(Math.max(0,r2(posicao(fr.cliId).aberto-(r2(numBR(fr.desc))||0))));render()},
  forma(v){fr.forma=v;render()},
  cancelar(){avisoCancelar('Cancelar este recebimento?',()=>ir('inicio'))},
  gravar(){const c=cliPorId(fr.cliId),v=r2(numBR(fr.valor))||0,dsc=r2(numBR(fr.desc))||0;if(!c){toast('Escolha o cliente');return}if(!(v>0)&&!(dsc>0)){toast('Informe o valor');return}if(v<0||dsc<0){toast('Valor inválido');return}
    const p=posicao(c.id);const vai=()=>{const r={id:'rc-'+uid(),data:fr.data,clienteId:c.id,cliente:c.nome,valor:v,forma:fr.forma,doc:fr.doc.trim(),obs:fr.obs.trim(),vendedor:quem()};if(fr.vendaId)r.vendaId=fr.vendaId;
      if(dsc>0){const aj={id:'aj-'+uid(),clienteId:c.id,cliente:c.nome,tipo:'C',data:fr.data,valor:dsc,desc:'Desconto no recebimento'+(fr.obs.trim()?' — '+fr.obs.trim():''),vendedor:quem()};if(fr.vendaId)aj.vendaId=fr.vendaId;salvarReg('ajustes',aj,true);r.desconto=dsc;r.ajusteId=aj.id}
      if(v>0)salvarReg('receb',r,true);ENTRAR.rec();render();window.scrollTo(0,0);
      const sal=posicao(c.id).aberto;janela(`<h3>✅ Recebimento gravado</h3><div class="kv"><div><span>Cliente</span><b>${esc(c.nome)}</b></div><div class="forte"><span>Recebido</span><b>${fmtR(v)}</b></div>${dsc>0?`<div><span>Desconto</span><b>${fmtR(dsc)}</b></div>`:''}<div><span>Saldo em aberto agora</span><b>${fmtR(sal)}</b></div></div>
        ${v>0?'<button class="verde" id="jW">🖼 Recibo em foto</button>':''}<button class="primary" id="jF">OK</button>`,(j,fechar)=>{if(v>0)j.querySelector('#jW').onclick=()=>exportarRel(relRecibo(r),'img',`Recibo ${r.cliente} ${fmtData(r.data).replace(/\//g,'-')}`);j.querySelector('#jF').onclick=fechar})};
    if(r2(v+dsc)>p.aberto+0.004)perguntar(`O valor com desconto (${fmtR(r2(v+dsc))}) é maior que o débito em aberto (${fmtR(p.aberto)}).`,'Gravar mesmo assim','var(--warn)',vai,'A diferença fica como crédito do cliente.');else vai()},
  recEd(id){const r=db.receb.find(x=>x.id===id);if(r)editarReceb(r)},
  recDel(id){const r=db.receb.find(x=>x.id===id);if(r)excluirReceb(r)},
};
function relRecibo(r){const p=posicao(r.clienteId);return{titulo:'Recibo',sub:[r.cliente,'Data '+fmtData(r.data)],xlsNome:'Recibo',blocos:[{kv:[['Recebemos de',r.cliente],['Valor recebido',fmtR(r.valor),'#1f8f4e',true]].concat(r.desconto?[['Desconto concedido',fmtR(r.desconto)]]:[]).concat([['Forma de pagamento',r.forma||'—'],['Data',fmtData(r.data)]]).concat(r.doc?[['Comprovante',r.doc]]:[]).concat([['Recebido por',r.vendedor||'—']])},{kv:[['Saldo em aberto após este pagamento',fmtR(p.aberto),p.vencido>0?'#b3261e':null,true]]}]}}
function textoRecibo(r){const P=cad.params;const sal=posicao(r.clienteId).aberto;
  return [`*${P.empresa}* — Recibo`,`_${P.unidade}_`,'',`Recebemos de *${r.cliente}* o valor de *${fmtR(r.valor)}* (${r.forma}) em ${fmtData(r.data)}.`,r.doc?`Comprovante: ${r.doc}`:'','',`Saldo em aberto após este pagamento: *${fmtR(sal)}*`,'',P.empresa,P.contato||''].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n').trim()}
function editarReceb(r){
  const ed=()=>janela(`<h3>✏️ Recebimento — ${esc(r.cliente)}</h3><div><label>Data</label><input type="date" id="jD" value="${r.data}"></div><div><label>Valor</label><input type="text" class="big" id="jV" inputmode="decimal" value="${txtBR(r.valor)}"></div>
    <div><label>Desconto (R$)</label><input type="text" id="jDs" inputmode="decimal" value="${r.desconto?txtBR(r.desconto):''}" placeholder="R$ 0,00"></div>
    <div><label>Pagar o título</label><select id="jTi"><option value="">Automático (mais antigo primeiro)</option>${db.vendas.filter(v=>v.clienteId===r.clienteId).sort((a,b)=>a.data.localeCompare(b.data)).map(v=>`<option value="${v.id}" ${v.id===r.vendaId?'selected':''}>${esc(numCurto(v))} · ${fmtData(v.data)} · ${fmtR(valorVenda(v))}</option>`).join('')}</select></div>
    <div><label>Forma</label><select id="jF">${(FORMAS.includes(r.forma)||!r.forma?FORMAS:FORMAS.concat([r.forma])).map(f=>`<option ${f===r.forma?'selected':''}>${f}</option>`).join('')}</select></div><div class="datas"><div><label>Doc.</label><input type="text" id="jDc" value="${esc(r.doc||'')}"></div><div><label>Obs.</label><input type="text" id="jO" value="${esc(r.obs||'')}"></div></div>
    <div class="row"><button class="danger" id="jX">🗑 Excluir</button><button class="primary" id="jS">Salvar</button></div>`,(j,fechar)=>{
    j.querySelector('#jX').onclick=()=>{fechar();confirmarExcluir(`Excluir recebimento de ${fmtR(r.valor)}${r.desconto?' (e o desconto de '+fmtR(r.desconto)+')':''}?`,()=>{if(r.ajusteId&&db.ajustes.some(a=>a.id===r.ajusteId))apagarReg('ajustes',r.ajusteId);apagarReg('receb',r.id);render();toast('Excluído')})};
    j.querySelector('#jS').onclick=()=>{const v=r2(numBR(j.querySelector('#jV').value));if(!(v>0)){toast('Valor inválido');return}
      const dsc=r2(numBR(j.querySelector('#jDs').value))||0,dt=j.querySelector('#jD').value||r.data,ti=j.querySelector('#jTi').value,n={...r,data:dt,valor:v,forma:j.querySelector('#jF').value,doc:j.querySelector('#jDc').value.trim(),obs:j.querySelector('#jO').value.trim()};if(ti)n.vendaId=ti;else delete n.vendaId;
      const aj=r.ajusteId&&db.ajustes.find(a=>a.id===r.ajusteId);
      if(dsc>0){if(aj){const a1={...aj,valor:dsc,data:dt};if(ti)a1.vendaId=ti;else delete a1.vendaId;salvarReg('ajustes',a1,false)}else{const a2={id:'aj-'+uid(),clienteId:r.clienteId,cliente:r.cliente,tipo:'C',data:dt,valor:dsc,desc:'Desconto no recebimento',vendedor:r.vendedor||quem()};if(ti)a2.vendaId=ti;salvarReg('ajustes',a2,true);n.ajusteId=a2.id}n.desconto=dsc}
      else{if(aj)apagarReg('ajustes',aj.id);delete n.desconto;delete n.ajusteId}
      salvarReg('receb',n,false);fechar();render();toast('Recebimento salvo')}});
  if(ehRecente(r.id))ed();else comSenha(ed);
}
function excluirReceb(r){const vai=()=>confirmarExcluir(`Excluir recebimento de ${r.cliente} (${fmtR(r.valor)})?`,()=>{if(r.ajusteId&&db.ajustes.some(a=>a.id===r.ajusteId))apagarReg('ajustes',r.ajusteId);apagarReg('receb',r.id);render();toast('Excluído')});if(ehRecente(r.id))vai();else comSenha(vai)}

/* =====================================================================
   DESPESCA (pesagem dos bags na fazenda)
   ===================================================================== */
let fb={data:chaveDia(),tanque:'',produtoId:'',peso:'',qtd:'',obs:''};
ENTRAR.desp=()=>{fb.data=chaveDia();fb.peso='';fb.qtd='';fb.obs=''};
function resumoBags(l){const kg=r3(l.reduce((s,b)=>s+Number(b.peso||0),0)),q=l.reduce((s,b)=>s+Number(b.qtd||0),0);return{n:l.length,kg,q,med:q?r3(kg/q):0}}
RENDER.desp=()=>{
  const el=$('t-desp'),d=despescaDaData(fb.data,false),tq=ativos(cad.tanques),pr=ativos(cad.produtos);
  if(!fb.produtoId&&pr.length===1)fb.produtoId=pr[0].id;
  let h=quemHtml()+`<section class="panel"><h2>Data</h2>${dataHtml('data',fb.data,'')}</section><section class="panel"><h2>Despesca</h2>${despHtml(fb.data)}</section>`;
  h+=`<section class="panel"><h2>Pesar bag</h2><label>Tanque / viveiro</label>${tq.length?`<div class="escolha">${tq.map(t=>`<button data-a="tq" data-v="${esc(t.nome)}" class="${fb.tanque===t.nome?'sel':''}">${esc(t.nome)}</button>`).join('')}</div>`:'<div class="vazio">Nenhum tanque cadastrado.</div>'}<button class="mini" data-a="tqNovo">+ Tanque</button>
    <label>Peixe</label><div class="escolha eq">${pr.map(p=>`<button data-a="pr" data-v="${p.id}" class="${fb.produtoId===p.id?'sel':''}">${esc(p.nome)}</button>`).join('')}</div>
    <div><label>Peso LÍQUIDO do bag (kg)</label><input type="text" class="big" id="bagPeso" data-f="peso" inputmode="decimal" value="${esc(fb.peso)}" placeholder="0,0" data-enter="gravar"></div>
    <div class="datas"><div><label>Qtd. de peixes (opcional)</label><input type="number" data-f="qtd" inputmode="numeric" value="${esc(fb.qtd)}"></div><div><label>Observação</label><input type="text" data-f="obs" value="${esc(fb.obs)}"></div></div>
    <button class="verde" data-a="gravar">✔ GRAVAR BAG</button></section>`;
  if(d){const doDia=db.bags.filter(b=>b.despescaId===d.id&&b.data===fb.data),tot=db.bags.filter(b=>b.despescaId===d.id),rd=resumoBags(doDia),rt=resumoBags(tot);
    const porT={};doDia.forEach(b=>{(porT[b.tanque+' · '+b.produto]=porT[b.tanque+' · '+b.produto]||[]).push(b)});
    h+=`<section class="panel"><h2>Bags do dia ${fmtData(fb.data)}</h2><div class="stat"><div><small>Bags</small><b class="num">${rd.n}</b></div><div><small>Kg líquido</small><b class="num">${fmtKg(rd.kg)}</b></div><div><small>Peixes</small><b class="num">${fmtI(rd.q)}</b></div><div><small>Peso médio</small><b class="num">${rd.q?fmtKg(rd.med):'—'}</b></div></div>
      ${Object.keys(porT).length?`<table class="tabela"><tr><th>Tanque · peixe</th><th class="r">Bags</th><th class="r">Kg</th></tr>${Object.entries(porT).map(([k,l])=>{const r=resumoBags(l);return`<tr><td>${esc(k)}</td><td class="r">${r.n}</td><td class="r">${fmtKg(r.kg)}</td></tr>`}).join('')}</table>`:''}
      ${doDia.slice().sort((a,b)=>String(b.registradoEm).localeCompare(String(a.registradoEm))).map(b=>`<button class="reg" data-a="bagEd" data-v="${b.id}"><div><span class="eqn">${esc(b.tanque)} · ${esc(b.produto)}</span><div class="faz">${fmtHora(b.registradoEm)}${b.qtd?' · '+fmtI(b.qtd)+' peixes':''}${b.lancadoPor?' · '+esc(b.lancadoPor):''}${ehRecente(b.id)?' <span class="tag">editável</span>':''}</div>${b.obs?`<div class="obs">${esc(b.obs)}</div>`:''}</div><div class="lt">${fmtKg(b.peso)}<small>kg</small></div></button>`).join('')}
      <p class="note">Total da despesca (todos os dias): <b>${rt.n} bags · ${fmtKg(rt.kg)} kg</b>${rt.q?` · ${fmtI(rt.q)} peixes`:''}</p></section>`}
  el.innerHTML=h;
};
CAMPOS.desp=(f,el,ev)=>{if(f==='data'&&ev==='change'){if(el.value){fb.data=el.value;render()}return}if(['peso','qtd','obs'].includes(f))fb[f]=el.value};
ACOES.desp={
  tq(v){fb.tanque=v;render()},pr(v){fb.produtoId=v;render()},
  tqNovo(){campoTexto('Novo tanque / viveiro','',n=>{n=n.toUpperCase();if(cad.tanques.some(t=>!t.inativo&&semAcento(t.nome)===semAcento(n))){toast('Já existe');return}cad.tanques.push(toque({id:'tq-'+uid(),nome:n}));salvarCad('Tanque cadastrado');fb.tanque=n;render()},'Ex.: VIVEIRO 01')},
  gravar(){if(!fb.tanque){toast('Escolha o tanque');return}if(!fb.produtoId){toast('Escolha o peixe');return}
    const kg=numBR(fb.peso);if(!(kg>0)){toast('Informe o peso líquido');return}if(kg>3000){toast('Peso muito alto — confira');return}
    if(despFechada(fb.data)){toast('Despesca encerrada — reabra na Gestão');return}
    const d=despescaDaData(fb.data,true),p=prodPorId(fb.produtoId);
    salvarReg('bags',{id:'bg-'+uid(),despescaId:d.id,data:fb.data,tanque:fb.tanque,produtoId:p.id,produto:p.nome,peso:r3(kg),qtd:parseInt(fb.qtd)||0,obs:fb.obs.trim()},true);
    fb.peso='';fb.qtd='';fb.obs='';render();toast(`Bag de ${fmtKg(kg)} kg gravado`);setTimeout(()=>{const i=$('bagPeso');if(i)i.focus()},40)},
  bagEd(id){const b=db.bags.find(x=>x.id===id);if(b)editarBag(b)},
};
function editarBag(b){
  if(despFechada(b.data)){toast('Despesca encerrada — reabra para alterar');return}
  const ed=()=>janela(`<h3>✏️ Bag — ${esc(b.tanque)} · ${esc(b.produto)}</h3><div><label>Peso líquido (kg)</label><input type="text" class="big" id="jP" inputmode="decimal" value="${txtBR(b.peso,3)}"></div>
    <div class="datas"><div><label>Peixes</label><input type="number" id="jQ" value="${b.qtd||''}"></div><div><label>Tanque</label><select id="jT">${ativos(cad.tanques).map(t=>`<option ${t.nome===b.tanque?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></div></div>
    <div><label>Observação</label><input type="text" id="jO" value="${esc(b.obs||'')}"></div>
    <div class="row"><button class="danger" id="jX">🗑 Excluir</button><button class="primary" id="jS">Salvar</button></div>`,(j,fechar)=>{
    j.querySelector('#jX').onclick=()=>{fechar();confirmarExcluir(`Excluir bag de ${fmtKg(b.peso)} kg?`,()=>{apagarReg('bags',b.id);render();toast('Bag excluído')})};
    j.querySelector('#jS').onclick=()=>{const kg=numBR(j.querySelector('#jP').value);if(!(kg>0)){toast('Peso inválido');return}
      salvarReg('bags',{...b,peso:r3(kg),qtd:parseInt(j.querySelector('#jQ').value)||0,tanque:j.querySelector('#jT').value||b.tanque,obs:j.querySelector('#jO').value.trim()},false);fechar();render();toast('Bag salvo')}});
  if(ehRecente(b.id)||cadLiberado)ed();else comSenha(ed);
}

</script>
<script src="gestao.js"></script>
</body>
